<style>
:root {
  --bg: #f4f5f7;
  --card: #fff;
  --text: #1a1a1a;
  --muted: #5c6370;
  --border: #e1e4e8;
  --accent: #2563eb;
  --accent2: #0d9488;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans",

  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 0.75rem 0.75rem 1.25rem;
  max-width: 40rem;
  margin-left: auto;
  margin-right: auto;
}
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 0.75rem;
  margin-bottom: 0.75rem;
}
.top-bar a {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  padding: 0.35rem 0.5rem;
  border-radius: 6px;
}
.top-bar a:hover, .top-bar a:focus-visible {
  text-decoration: underline;
  outline: none;
}
.page-title {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0 0 0.35rem;
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
}
.lead {
  margin: 0 0 0.5rem;
  font-size: 0.9rem;
  color: var(--muted);
}
.report-disclaimer {
  margin: 0 0 0.75rem;
  padding: 0.55rem 0.65rem;
  font-size: 0.82rem;
  line-height: 1.45;
  color: var(--muted);
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.card {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 0.85rem 1rem;
  margin-bottom: 0.75rem;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.item-mgmt {
  margin: -0.15rem 0 0;
  font-size: 0.82rem;
  color: var(--muted);
  font-weight: 600;
}
.card-head {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}
.card-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0;
}
.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.45rem 0.75rem;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  min-height: 40px;
  touch-action: manipulation;
}
.btn-map {
  background: var(--accent);
  color: #fff;
}
.btn-map:hover, .btn-map:focus { filter: brightness(1.05); }
.btn-note {
  background: #fff;
  color: var(--accent2);
  border: 2px solid var(--accent2);
}
.btn-note[aria-expanded="true"] {
  background: var(--accent2);
  color: #fff;
}
.note-panel {
  margin-top: 0.65rem;
  padding: 0.65rem 0.75rem;
  background: #f8fafc;
  border-radius: 8px;
  border: 1px dashed var(--border);
  font-size: 0.92rem;
  color: var(--text);
}
.note-panel[hidden] { display: none !important; }
.two-map-wrap {
  margin-top: 0.65rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.two-map-wrap[hidden] { display: none !important; }
.share-two-map-canvas {
  width: 100%;
  height: min(45vh, 320px);
  min-height: 200px;
}
.leaflet-tooltip.two-tip {
  font-weight: 600;
  font-size: 0.85rem;
  padding: 2px 6px;
  border: none;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.map-section {
  margin-top: 1.0rem;
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 0.75rem 1rem 1rem;
  margin-bottom: 0.85rem;
}
.map-section h2 {
  font-size: 1.05rem;
  margin: 0 0 0.5rem;
}
#share-map {
  width: 100%;
  height: min(55vh, 420px);
  min-height: 220px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.map-empty .muted-tiny {
  margin: 0;
  font-size: 0.88rem;
  color: var(--muted);
}
.leaflet-container { font-family: inherit; }
.muted-tiny {
  font-size: 0.88rem;
  color: var(--muted);
}
.footer-note {
  margin-top: 1.1rem;
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
}
@media (min-width: 480px) {
  .card-head {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
  }
  .page-title { font-size: 1.4rem; }

.card-actions-revert {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.35rem;
  flex-basis: 100%;
  width: 100%;
  margin-top: 0.35rem;
  padding-top: 0.55rem;
  border-top: 1px dashed var(--border);

.btn-revert {
  background: #fff7ed;
  color: #9a3412;
  border: 2px solid #fdba74;
}
.btn-revert:hover {
  background: #ffedd5;
}
.btn-revert-disabled {
  background: #f1f5f9;
  color: #64748b;
  border: 2px dashed #94a3b8;
  cursor: not-allowed;
  opacity: 0.85;
}
.btn-revert-disabled:disabled {
  cursor: not-allowed;
}
.revert-hint {
  margin: 0;
  line-height: 1.4;
}
</style>
</head>

        + '<div class="card-actions card-actions-revert" role="group" aria-label="現調待ちに戻す">'
        + '<button type="button" class="btn btn-revert" data-negotiation-revert>現調待ちに戻す</button>'
        + '<p class="revert-hint muted-tiny">現調待ちから即時昇格した案件です。</p>'
        + '<p class="negotiation-revert-status muted-tiny" data-negotiation-revert-status hidden role="status"></p>'
        + '</div></div>'
        + '<div class="note-panel">' + escHtml(note) + '</div>'
        + '</article>';
      // 地図より前に挿入して既存カードと同じ一覧エリアに表示する
      if (mapSection) {
        mapSection.insertAdjacentHTML("beforebegin", html);
      } else {
        host.insertAdjacentHTML("beforeend", html);
      }
      existing[key] = true;
      idx += 1;
    });
  }
  function bindRevertButtons() {
    document.querySelectorAll(".negotiation-card[data-management-no-key]").forEach(function(card) {
      var key = (card.getAttribute("data-management-no-key") || "").trim();
      var btn = card.querySelector("[data-negotiation-revert]");
      var statusEl = card.querySelector("[data-negotiation-revert-status]");
      if (!key || !btn || !statusEl) return;
      if (btn.getAttribute("data-revert-bound") === "1") return;
      btn.setAttribute("data-revert-bound", "1");
      if (!PORTAL_STATUS_API_KEY) {
        btn.disabled = true;
        return;
      }
      btn.addEventListener("click", function() {
        if (btn.disabled) return;
        if (!window.confirm(REVERT_CONFIRM)) return;
        btn.disabled = true;
        statusEl.hidden = false;
        statusEl.textContent = "送信中...";
        fetch(PORTAL_STATUS_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: PORTAL_STATUS_API_KEY,
          },
          body: JSON.stringify({
            management_no_key: key,
            action: "revert_to_survey_wait",
            source: "portal_negotiation",
            note: "",
          }),
        })
          .then(function(res) {
            return res
              .json()
              .catch(function() { return {}; })
              .then(function(data) { return { res: res, data: data }; });
          })
          .then(function(r) {
            if (r.res.ok && r.data && r.data.ok) {
              card.hidden = true;
              statusEl.textContent = "現調待ちへ戻しました";
              try {
                localStorage.removeItem("portal_case_status:" + key);
              } catch (e2) {}
              return;
            }
            btn.disabled = false;
            statusEl.textContent = "送信に失敗しました";
          })
          .catch(function() {
            btn.disabled = false;
            statusEl.textContent = "送信に失敗しました";
          });
      });
    });
  }
  function fetchPortalOverrides() {
    if (!PORTAL_STATUS_API_KEY) return Promise.resolve(Object.create(null));
    return fetch(PORTAL_STATUS_ENDPOINT, {
      method: "GET",
      headers: { apikey: PORTAL_STATUS_API_KEY },
    })
      .then(function(res) {
        return res.json().catch(function() { return {}; });
      })
      .then(function(data) {
        if (!data || !data.ok) return Object.create(null);
        return portalStatusMapFromResponse(data);
      })
      .catch(function() { return Object.create(null); });
  }
  fetchPortalOverrides().then(function(statusMap) {
    appendPromotedCards(statusMap);
    bindRevertButtons();
  });

})();
  </script>
</body>
</html>
