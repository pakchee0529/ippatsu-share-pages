<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コンビレンチ状工具（寸法未確認）</title><link rel="stylesheet" href="../style.css"></head><body><a class="skip" href="#main">本文へ</a><header>現場OJT・確認中の教材</header><main id="main" class="wrap new-lesson"><nav><a href="../index.html">OJTの入口</a></nav><h1>コンビレンチ状工具（寸法未確認）</h1><figure><img src="../assets/DSCF0038.JPG" alt="写真38 コンビレンチ状工具（寸法未確認）"><figcaption>既存の会社写真38。画像を実見して名称候補を訂正。</figcaption></figure><p>筒の両端にソケット状の口、横へ延びる軸の先に平刃が見えます。ソケットと平刃を組み合わせたコンビレンチ状工具です。ソケット寸法・適合機種・用途別の操作は未確認です。</p><p><a href="../details/sharpen.html">チェーンソーの手入れ・目立て</a></p><p>外観で名称候補を整理しています。会社での正式な呼び名と適合は別に確認します。</p><p><a href="../index.html">↑ OJTの入口へ</a></p></main><dialog id="guide-zoom"><button id="guide-close" type="button">閉じる</button><p>左右に動かして細部を確認できます。</p><div style="overflow:auto"><img id="guide-large" alt=""></div><p id="guide-caption"></p></dialog><script>document.addEventListener('click',function(e){let target=e.target.closest('button.zoom')?.querySelector('img')||(e.target.matches('main figure img, main .step img')?e.target:null);if(target){let d=document.querySelector('#guide-zoom'),i=document.querySelector('#guide-large');i.src=target.src;i.alt=target.alt;document.querySelector('#guide-caption').textContent=target.closest('figure')?.innerText||target.alt;d.showModal()}});document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('main figure img, main .step img')){e.preventDefault();e.target.click()}});document.querySelector('#guide-close').addEventListener('click',()=>document.querySelector('#guide-zoom').close());</script></body></html>
