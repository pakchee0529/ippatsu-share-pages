<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>やすり</title><link rel="stylesheet" href="../style.css"></head><body><a class="skip" href="#main">本文へ</a><header>現場OJT・確認中の教材</header><main id="main" class="wrap new-lesson"><nav><a href="../index.html">OJTの入口</a></nav><h1>やすり</h1><figure><img src="../assets/DSCF0037.JPG" alt="写真37 やすり"><figcaption>既存の会社写真37。画像を実見して名称候補を訂正。</figcaption></figure><section class="block company"><h2>会社での呼び名</h2><p>社内では「やすり」と呼びます。</p><small>2026-10-30の写真番号別回答に基づく名称。操作・使用条件の確認とは別です。</small></section><p>赤い柄と、軸全体に細かいやすり目がある細い円柱が見えます。平刃や十字の先端は見えず、ねじを回すドライバーとは扱いません。チェーン目立て用の丸やすり候補ですが、径と適合チェーンは未確認です。</p><p><a href="../details/sharpen.html">チェーンソーの手入れ・目立て</a></p><p>外観で名称候補を整理しています。会社での呼び名は「やすり」です。径と適合は現物で確認します。</p><p><a href="../index.html">↑ OJTの入口へ</a></p></main><dialog id="guide-zoom"><button id="guide-close" type="button">閉じる</button><p>左右に動かして細部を確認できます。</p><div style="overflow:auto"><img id="guide-large" alt=""></div><p id="guide-caption"></p></dialog><script>document.addEventListener('click',function(e){let target=e.target.closest('button.zoom')?.querySelector('img')||(e.target.matches('main figure img, main .step img')?e.target:null);if(target){let d=document.querySelector('#guide-zoom'),i=document.querySelector('#guide-large');i.src=target.src;i.alt=target.alt;document.querySelector('#guide-caption').textContent=target.closest('figure')?.innerText||target.alt;d.showModal()}});document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('main figure img, main .step img')){e.preventDefault();e.target.click()}});document.querySelector('#guide-close').addEventListener('click',()=>document.querySelector('#guide-zoom').close());</script></body></html>
