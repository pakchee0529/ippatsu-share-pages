<svg xmlns="http://www.w3.org/2000/svg" width="560" height="495" viewBox="0 0 560 495"><title>MUC254Dの操作のつながり</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="495" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><rect x="22" y="18" width="516" height="72" rx="11" fill="white" stroke="#a4bca5"/><text x="38" y="47" font-size="22" fill="#263e30">準備：電源を断って確認</text><text x="38" y="75" font-size="17" fill="#263e30">刃の組付け・張り・油・外観は手入れ編へ</text><rect x="22" y="109" width="516" height="72" rx="11" fill="white" stroke="#a4bca5"/><text x="38" y="138" font-size="22" fill="#263e30">主電源：指を放して入れる</text><text x="38" y="166" font-size="17" fill="#263e30">ロックオフと引金を放し、刃を周囲から離す</text><rect x="22" y="200" width="516" height="72" rx="11" fill="white" stroke="#a4bca5"/><text x="38" y="229" font-size="22" fill="#263e30">運転：保持 → 解除 → 引金</text><text x="38" y="257" font-size="17" fill="#263e30">両手を確保。ブレーキ解除時は引金を放す</text><rect x="22" y="291" width="516" height="72" rx="11" fill="white" stroke="#a4bca5"/><text x="38" y="320" font-size="22" fill="#263e30">停止：引金を放す → 完全停止</text><text x="38" y="348" font-size="17" fill="#263e30">主電源を切る。自動電源切れを待たない</text><rect x="22" y="382" width="516" height="72" rx="11" fill="white" stroke="#a4bca5"/><text x="38" y="411" font-size="22" fill="#263e30">持ち運び：取説39頁の状態へ</text><text x="38" y="439" font-size="17" fill="#263e30">バッテリを外す・ブレーキ・バーケース</text></g></svg>