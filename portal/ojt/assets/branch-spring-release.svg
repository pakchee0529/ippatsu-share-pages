<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390"><title>枝の反発と樹木の落下は別の動き</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="390" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="20" y="31" font-size="21" fill="#263e30">曲げられた枝は、横・上へ戻ることもある</text><path d="M80 292Q153 208 150 88" fill="none" stroke="#ab8256" stroke-width="17"/><path d="M80 292L80 68" fill="none" stroke="#83937c" stroke-width="12" stroke-dasharray="8 7"/><path d="M145 91Q112 58 84 73" fill="none" stroke="#b34332" stroke-width="4" marker-end="url(#red)"/><text x="245" y="139" font-size="19" fill="#263e30">実線：曲げられた枝</text><text x="245" y="181" font-size="19" fill="#263e30">点線：戻る側の例</text><text x="25" y="331" font-size="18" fill="#263e30">幹の支持喪失・転がりとは分けて考えます</text><text x="25" y="361" font-size="16" fill="#263e30">切断箇所や、近づいてよい場所を示す図ではありません</text></g></svg>