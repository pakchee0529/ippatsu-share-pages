<svg xmlns="http://www.w3.org/2000/svg" width="560" height="370" viewBox="0 0 560 370"><title>バー先端上部の接触とキックバック</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="370" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="20" y="33" font-size="22" fill="#263e30">先端上部の接触 → 上・後ろへ跳ね返る</text><rect x="355" y="167" width="145" height="100" rx="22" fill="#c8d4cf" stroke="#63796c" stroke-width="3"/><path d="M355 195H135A20 20 0 0 0 135 235H355" fill="#e5e8dc" stroke="#63796c" stroke-width="4"/><path d="M122 202Q112 187 139 194" fill="none" stroke="#ba4932" stroke-width="13"/><circle cx="119" cy="197" r="12" fill="none" stroke="#b34332" stroke-width="3"/><path d="M117 184Q140 100 220 85" fill="none" stroke="#b34332" stroke-width="5" marker-end="url(#red)"/><text x="217" y="109" font-size="18" fill="#263e30">赤：本体・バーの反力</text><text x="25" y="315" font-size="17" fill="#263e30">枝の向こう側や地面への、見えない先端接触にも注意</text><text x="25" y="344" font-size="16" fill="#263e30">力の概念。人体や安全な立ち位置を示す図ではありません</text></g></svg>