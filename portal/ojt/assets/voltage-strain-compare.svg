<svg xmlns="http://www.w3.org/2000/svg" width="560" height="435" viewBox="0 0 560 435"><title>耐張と低圧引留の形を見る・概念図</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="435" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="20" y="30" font-size="22" fill="#263e30">引留める形式を比べる（概念図）</text><text x="22" y="80" font-size="22" fill="#263e30">高圧耐張の例</text><text x="310" y="80" font-size="22" fill="#263e30">低圧引留1号の例</text><path d="M35 180H95M205 180H255" stroke="#667976" stroke-width="9"/><ellipse cx="88" cy="180" rx="18" ry="12" fill="none" stroke="#667976" stroke-width="6"/><ellipse cx="215" cy="180" rx="18" ry="12" fill="none" stroke="#667976" stroke-width="6"/><rect x="108" y="142" width="82" height="76" rx="22" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><ellipse cx="145" cy="180" rx="11" ry="57" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><path d="M385 128Q420 150 455 128V156Q435 180 455 204V234Q420 215 385 234V204Q405 180 385 156Z" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><ellipse cx="420" cy="137" rx="12" ry="7" fill="#667976"/><path d="M480 112L432 135" stroke="#3b7197" stroke-width="2"/><text x="20" y="286" font-size="19" fill="#263e30">両端の接続金具</text><text x="20" y="317" font-size="19" fill="#263e30">軸方向につながる</text><text x="308" y="286" font-size="18" fill="#263e30">中央の穴・胴の周溝</text><text x="308" y="317" font-size="18" fill="#263e30">固定金具と溝を分ける</text><text x="22" y="365" font-size="16" fill="#263e30">張力を受ける系統の形を比較。接続の施工図ではない</text><text x="22" y="405" font-size="18" fill="#263e30">連数・大きさ・色だけで高低圧を決めない</text></g></svg>