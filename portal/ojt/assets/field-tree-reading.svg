<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img"><title>一本の木を四つの範囲で見る</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44730"/></marker></defs><rect width="560" height="360" rx="15" fill="#f4f7ef"/><g font-family="sans-serif" fill="#223d2b" font-size="20"><text x="18" y="30" font-size="22">幹だけでなく、上・左右・根元・周囲へ</text><path d="M265 320L277 134L300 134L305 320" fill="#a27d56" stroke="#614a31" stroke-width="3"/><g fill="#86a77a" stroke="#58704b" stroke-width="2"><ellipse cx="288" cy="105" rx="63" ry="66"/><ellipse cx="352" cy="131" rx="75" ry="48"/><ellipse cx="231" cy="143" rx="40" ry="37"/></g><path d="M260 320Q284 300 320 320M20 323H540" stroke="#62795e" fill="none" stroke-width="5"/><text x="22" y="73" font-size="20">①枝葉の偏り</text><path d="M152 77L225 101" stroke="#527b59" stroke-width="2"/><text x="356" y="56" font-size="20">②頭上・隣木</text><path d="M400 63L370 96" stroke="#527b59" stroke-width="2"/><text x="16" y="257" font-size="20">③幹・根元</text><path d="M139 251L275 274" stroke="#527b59" stroke-width="2"/><text x="354" y="287" font-size="20">④地形・周囲</text><path d="M355 294L326 317" stroke="#527b59" stroke-width="2"/></g></svg>