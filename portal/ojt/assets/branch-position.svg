<svg xmlns="http://www.w3.org/2000/svg" width="560" height="450" viewBox="0 0 560 450"><title>斜面上部を確保し、他の危険も見る</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="450" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="20" y="30" font-size="23" fill="#263e30">作業位置の基本：斜面上部</text><path d="M30 115L530 353" stroke="#73886a" stroke-width="6"/><circle cx="302" cy="211" r="34" fill="#b68b59" stroke="#66513b" stroke-width="3"/><circle cx="137" cy="91" r="15" fill="none" stroke="#405c4a" stroke-width="4"/><path d="M137 108V149M113 125L159 125M137 149L118 156M137 149L149 169" fill="none" stroke="#405c4a" stroke-width="5"/><text x="33" y="69" font-size="19" fill="#263e30">山側</text><text x="407" y="301" font-size="19" fill="#263e30">谷側</text><path d="M445 137L500 165" fill="none" stroke="#666" stroke-width="4" marker-end="url(#gray)"/><text x="383" y="110" font-size="17" fill="#263e30">斜面の下り</text><text x="32" y="263" font-size="18" fill="#263e30">さらに見る：上方の樹木・反発・根返り・足場</text><text x="24" y="393" font-size="17" fill="#263e30">樹木の上に乗らない／幹や刃の下へ足を入れない</text><text x="24" y="425" font-size="15" fill="#263e30">位置関係の模式。ここに立てば必ず安全、という図ではありません</text></g></svg>