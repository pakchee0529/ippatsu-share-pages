<svg xmlns="http://www.w3.org/2000/svg" width="560" height="410" viewBox="0 0 560 410"><title>T-7確認用・前進用ハンドルの抜止め</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44730"/></marker></defs><rect width="560" height="410" rx="14" fill="#f3f7ef"/><g font-family="sans-serif" fill="#243b2e"><text x="20" y="32" font-size="21">前進側：切欠きを合わせる → 回して抜止め</text><rect x="81" y="80" width="47" height="153" rx="6" fill="#b9c5c8" stroke="#536c73" stroke-width="3"/><rect x="99" y="208" width="13" height="26" fill="#f3f7ef"/><path d="M105 269V219M105 247H122" stroke="#57665f" stroke-width="10"/><path d="M160 140L160 211" stroke="#b44730" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="36" y="305" font-size="19">切欠きと抜止め</text><circle cx="380" cy="174" r="57" fill="white" stroke="#84a38b" stroke-width="3"/><path d="M340 142A50 50 0 0 1 422 155" fill="none" stroke="#b44730" stroke-width="4" marker-end="url(#arr)"/><text x="350" y="186" font-size="29">90°</text><text x="292" y="305" font-size="19">前進側で回して固定</text><text x="23" y="351" font-size="18">バック側へ同じ回転操作を当てはめません</text><text x="23" y="380" font-size="17">抜止めの位置・形は現物と原典P8で確認</text></g></svg>