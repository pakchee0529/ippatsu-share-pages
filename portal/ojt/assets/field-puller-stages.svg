<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img"><title>牽引前から片付けまでの区切り</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44730"/></marker></defs><rect width="560" height="390" rx="15" fill="#f4f7ef"/><g font-family="sans-serif" fill="#223d2b" font-size="20"><rect x="25" y="25" width="510" height="70" rx="12" fill="white" stroke="#a5bea7"/><text x="42" y="53" font-size="22">1　計画・選定</text><text x="42" y="80" font-size="17">対象の動き、固定先、用具、連絡と立入範囲</text><rect x="25" y="113" width="510" height="70" rx="12" fill="white" stroke="#a5bea7"/><text x="42" y="141" font-size="22">2　無荷重で準備</text><text x="42" y="168" font-size="17">本体と専用ワイヤーの識別・点検・取説照合</text><rect x="25" y="201" width="510" height="70" rx="12" fill="white" stroke="#a5bea7"/><text x="42" y="229" font-size="22">3　操作と監視</text><text x="42" y="256" font-size="17">担当者が操作し、樹木と固定先の変化も見る</text><rect x="25" y="289" width="510" height="70" rx="12" fill="white" stroke="#a5bea7"/><text x="42" y="317" font-size="22">4　荷重を処理して回収</text><text x="42" y="344" font-size="17">安定・張力解除を確認してから取外し・収納</text></g></svg>