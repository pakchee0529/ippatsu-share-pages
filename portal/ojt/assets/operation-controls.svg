<svg xmlns="http://www.w3.org/2000/svg" width="560" height="405" viewBox="0 0 560 405"><title>操作部・安全装置の役割</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="405" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><rect x="20" y="15" width="520" height="80" rx="12" fill="white" stroke="#a4bca5"/><text x="38" y="46" font-size="22" fill="#263e30">主電源／引金／ロックオフ</text><text x="38" y="76" font-size="18" fill="#263e30">運転の許可と回転指示。役割は同じではない</text><rect x="20" y="109" width="520" height="80" rx="12" fill="white" stroke="#a4bca5"/><text x="38" y="140" font-size="22" fill="#263e30">チェーンブレーキ</text><text x="38" y="170" font-size="18" fill="#263e30">回転を止める装置。反力そのものは消えない</text><rect x="20" y="203" width="520" height="80" rx="12" fill="white" stroke="#a4bca5"/><text x="38" y="234" font-size="22" fill="#263e30">ハンドガード／チェーンキャッチャー</text><text x="38" y="264" font-size="18" fill="#263e30">前方の保護・ブレーキ作動、外れた刃への備え</text><rect x="20" y="297" width="520" height="80" rx="12" fill="white" stroke="#a4bca5"/><text x="38" y="328" font-size="22" fill="#263e30">二つのハンドル</text><text x="38" y="358" font-size="18" fill="#263e30">両手で支え、急な動きにも保持を続ける</text></g></svg>