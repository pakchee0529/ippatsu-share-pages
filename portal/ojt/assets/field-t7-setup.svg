<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380"><title>T-7確認用・解放と挿入の位置関係</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44730"/></marker></defs><rect width="560" height="380" rx="14" fill="#f3f7ef"/><g font-family="sans-serif" fill="#243b2e"><text x="20" y="32" font-size="23">無荷重で解放 → 専用ワイヤーを挿入</text><rect x="185" y="112" width="190" height="90" rx="18" fill="#edbd75" stroke="#6b6c56" stroke-width="3"/><path d="M143 157H185M375 157H399" stroke="#636b68" stroke-width="8"/><circle cx="125" cy="157" r="18" fill="none" stroke="#636b68" stroke-width="7"/><text x="211" y="166" font-size="18">本体（模式）</text><text x="52" y="91" font-size="18">アンカーフック側</text><text x="365" y="91" font-size="18">ロープガイド側</text><path d="M54 157H508" stroke="#64787c" stroke-width="5" stroke-dasharray="9 6"/><path d="M491 231L402 231" stroke="#b44730" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M89 231L25 231" stroke="#b44730" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="403" y="268" font-size="18">ここから入れる</text><text x="20" y="268" font-size="18">先端を完全に出す</text><text x="22" y="323" font-size="17">図はワイヤーの通る向き。内部の施工図ではありません</text><text x="22" y="352" font-size="17">固定側 ←　　　　　　　　　　　→ 牽引対象側</text></g></svg>