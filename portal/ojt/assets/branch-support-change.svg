<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390"><title>支え枝がなくなると幹も動く</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="390" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="18" y="30" font-size="21" fill="#263e30">枝を支えにしている幹：支えの変化を見る</text><path d="M30 299H535" stroke="#718466" stroke-width="5"/><path d="M90 120H460" stroke="#ac895f" stroke-width="29" stroke-linecap="round"/><path d="M135 135L135 295" stroke="#8d704e" stroke-width="17"/><path d="M390 135L425 295" stroke="#8d704e" stroke-width="14" stroke-dasharray="8 7"/><path d="M91 104L438 230" stroke="#ac895f" stroke-width="24" stroke-linecap="round" opacity=".32"/><path d="M312 57L312 96" fill="none" stroke="#666" stroke-width="4" marker-end="url(#gray)"/><path d="M135 258L135 203" fill="none" stroke="#437b55" stroke-width="4" marker-end="url(#green)"/><path d="M477 148L456 202" fill="none" stroke="#b34332" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#red)"/><text x="23" y="336" font-size="17" fill="#263e30">灰↓自重　緑↑支え　赤点線：起こり得る移動</text><text x="23" y="365" font-size="17" fill="#263e30">点線の枝を切る指示ではありません</text></g></svg>