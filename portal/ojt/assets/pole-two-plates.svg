<svg xmlns="http://www.w3.org/2000/svg" width="560" height="488" viewBox="0 0 560 488"><title>番号札は会社表示を先に読み、上下は目安にする</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="488" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="20" y="32" font-size="23" fill="#263e30">上下が逆の例を、両方覚える</text><text x="25" y="78" font-size="21" fill="#263e30">例1　関電札が上</text><text x="307" y="78" font-size="21" fill="#263e30">例2　関電札が下</text><path d="M140 95V390M420 95V390" stroke="#c3c8bc" stroke-width="32"/><rect x="28" y="113" width="220" height="92" rx="9" fill="white" stroke="#6c8273" stroke-width="3"/><text x="40" y="141" font-size="18" fill="#263e30">関西電力送配電</text><text x="40" y="169" font-size="17" fill="#263e30">冠称：例A</text><text x="40" y="193" font-size="17" fill="#263e30">番号：00A</text><rect x="28" y="249" width="220" height="92" rx="9" fill="white" stroke="#6c8273" stroke-width="3"/><text x="40" y="277" font-size="18" fill="#263e30">NTT</text><text x="40" y="305" font-size="17" fill="#263e30">冠称：例B</text><text x="40" y="329" font-size="17" fill="#263e30">番号：00B</text><rect x="309" y="113" width="220" height="92" rx="9" fill="white" stroke="#6c8273" stroke-width="3"/><text x="321" y="141" font-size="18" fill="#263e30">NTT</text><text x="321" y="169" font-size="17" fill="#263e30">冠称：例C</text><text x="321" y="193" font-size="17" fill="#263e30">番号：00C</text><rect x="309" y="249" width="220" height="92" rx="9" fill="white" stroke="#6c8273" stroke-width="3"/><text x="321" y="277" font-size="18" fill="#263e30">関西電力送配電</text><text x="321" y="305" font-size="17" fill="#263e30">冠称：例D</text><text x="321" y="329" font-size="17" fill="#263e30">番号：00D</text><text x="22" y="427" font-size="18" fill="#263e30">上の札は所有者の目安。「上＝関電」とは限りません</text><text x="22" y="461" font-size="16" fill="#263e30">全て架空の概念札。現物の標準配置・書式を保証しません</text></g></svg>