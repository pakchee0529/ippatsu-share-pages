<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520"><title>T-7確認用・前進とバックのワイヤー移動</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44730"/></marker></defs><rect width="560" height="520" rx="14" fill="#f3f7ef"/><g font-family="sans-serif" fill="#243b2e"><text x="20" y="30" font-size="22">本体を固定した例：動くのはワイヤー</text><text x="24" y="68" font-size="22">前進レバーで往復</text><rect x="185" y="88" width="190" height="90" rx="18" fill="#edbd75" stroke="#6b6c56" stroke-width="3"/><path d="M143 133H185M375 133H399" stroke="#636b68" stroke-width="8"/><circle cx="125" cy="133" r="18" fill="none" stroke="#636b68" stroke-width="7"/><text x="211" y="142" font-size="18">本体（模式）</text><path d="M20 133H535" stroke="#64787c" stroke-width="6"/><path d="M510 194L424 194" stroke="#b44730" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="312" y="220" font-size="18">牽引対象側 → 本体側へ</text><text x="24" y="274" font-size="22">バックレバーで往復</text><rect x="185" y="294" width="190" height="90" rx="18" fill="#edbd75" stroke="#6b6c56" stroke-width="3"/><path d="M143 339H185M375 339H399" stroke="#636b68" stroke-width="8"/><circle cx="125" cy="339" r="18" fill="none" stroke="#636b68" stroke-width="7"/><text x="211" y="348" font-size="18">本体（模式）</text><path d="M20 339H535" stroke="#64787c" stroke-width="6"/><path d="M424 400L510 400" stroke="#b44730" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="312" y="426" font-size="18">本体側 → 牽引対象側へ</text><text x="24" y="466" font-size="18">アンカーフックは左、ロープガイドは右</text><text x="24" y="495" font-size="17">レバー自体の傾け方は原典の図と現物で照合</text></g></svg>