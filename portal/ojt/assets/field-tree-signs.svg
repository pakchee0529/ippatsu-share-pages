<svg xmlns="http://www.w3.org/2000/svg" width="560" height="365" viewBox="0 0 560 365" role="img"><title>見える異常と分からない内部を分ける</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44730"/></marker></defs><rect width="560" height="365" rx="15" fill="#f4f7ef"/><g font-family="sans-serif" fill="#223d2b" font-size="20"><rect x="125" y="55" width="72" height="199" fill="#c8a67d"/><path d="M125 55L125 254M197 55L197 254" stroke="#a57e50" stroke-width="25"/><path d="M160 77L150 118L170 140L155 185" stroke="#573529" fill="none" stroke-width="5"/><ellipse cx="185" cy="209" rx="13" ry="22" fill="#4c3d2e"/><text x="255" y="91" font-size="20">割れ・穴・傷</text><text x="255" y="132" font-size="20">枝先の枯れ・折れ</text><text x="255" y="173" font-size="20">樹皮の浮き等</text><text x="33" y="301" font-size="22">外からの兆候 → 場所と形を伝える</text><text x="33" y="334" font-size="19">外観だけで内部の健全性を保証しない</text></g></svg>