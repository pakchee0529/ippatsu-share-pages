 y="154" width="22" height="33" rx="10" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><rect x="463" y="235" width="22" height="33" rx="10" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><rect x="352" y="198" width="60" height="25" rx="12" fill="#abb9b1" stroke="#65736b" stroke-width="2"/><rect x="433" y="198" width="60" height="25" rx="12" fill="#abb9b1" stroke="#65736b" stroke-width="2"/><path d="M510 139L474 155M520 282L470 220M230 140L211 197" fill="none" stroke="#3b7197" stroke-width="2"/><text x="20" y="321" font-size="18" fill="#263e30">両端の金具・軸方向</text><text x="302" y="321" font-size="18" fill="#263e30">2長穴・中央の橋・4突起</text><text x="22" y="370" font-size="16" fill="#263e30">形の入口の比較。高圧引込の採用形式は現場未確認</text><text x="22" y="408" font-size="16" fill="#263e30">取付位置・接続方法・電線の本数は示していない</text></g></svg>