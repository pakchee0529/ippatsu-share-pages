<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460"><title>高圧ピンと低圧ピンの形を比べる・概念図</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="460" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="20" y="30" font-size="23" fill="#263e30">ピン形同士を比べる（概念図）</text><text x="33" y="80" font-size="22" fill="#263e30">高圧ピンの例</text><text x="315" y="80" font-size="22" fill="#263e30">低圧ピンの例</text><path d="M140 205v76" stroke="#667976" stroke-width="12"/><rect x="118" y="130" width="44" height="70" rx="12" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><path d="M85 165Q140 135 195 165L183 185H97Z" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><path d="M215 105L160 140" stroke="#3b7197" stroke-width="2"/><path d="M420 205v76" stroke="#667976" stroke-width="12"/><path d="M395 130Q420 120 445 130L452 142Q432 160 442 170L455 188Q420 203 385 188L398 170Q408 160 388 142Z" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><ellipse cx="420" cy="183" rx="33" ry="10" fill="#e7e4cf" stroke="#65736b" stroke-width="3"/><path d="M495 105L440 140" stroke="#3b7197" stroke-width="2"/><text x="25" y="320" font-size="18" fill="#263e30">傘状の張出し・首の溝</text><text x="304" y="320" font-size="18" fill="#263e30">くびれ・短い胴の溝</text><text x="22" y="365" font-size="18" fill="#263e30">青線＝見る箇所　灰＝ピン（取付状態ではない）</text><text x="22" y="400" font-size="17" fill="#263e30">両方にピンがある。「ピンがある＝高圧」ではない</text><text x="22" y="435" font-size="16" fill="#263e30">実物は別形もある。寸法・取付け手順を示さない</text></g></svg>