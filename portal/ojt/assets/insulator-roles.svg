<svg xmlns="http://www.w3.org/2000/svg" width="560" height="385" viewBox="0 0 560 385"><title>がいしを役割と取り付け相手から見る</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="385" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="20" y="32" font-size="20" fill="#263e30">役割の整理図：製品の形・施工図ではありません</text><text x="25" y="84" font-size="22" fill="#263e30">ピン形式：支える関係を見る</text><rect x="40" y="110" width="480" height="57" rx="10" fill="white" stroke="#9db298"/><text x="63" y="146" font-size="23" fill="#263e30">電線 → がいし → ピン・支持側</text><text x="25" y="224" font-size="21" fill="#263e30">耐張・引留形式：張力を受ける関係を見る</text><rect x="40" y="251" width="480" height="57" rx="10" fill="white" stroke="#9db298"/><text x="58" y="287" font-size="21" fill="#263e30">電線の張力 → がいし・金具 → 支持側</text><text x="25" y="355" font-size="18" fill="#263e30">同じ役割でも高圧用・低圧用の形は一つではない</text></g></svg>