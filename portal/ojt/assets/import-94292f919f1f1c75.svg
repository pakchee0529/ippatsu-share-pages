<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"><title>実写とは別の補助模式図：カラスザンショウの刺と跡</title><rect width="100%" height="100%" fill="#f5f7ee"/><g font-family="Meiryo,sans-serif" fill="#243d2a"><text x="25" y="40" font-size="28">模式図：カラスザンショウの幹の変化</text><text x="25" y="78" font-size="20">実写未確保／樹齢や全個体を保証する図ではありません</text><rect x="135" y="140" width="130" height="330" rx="35" fill="#7e9d6b"/><rect x="520" y="140" width="145" height="330" rx="22" fill="#9a9383"/><path d="M140 180L95 155L140 202M260 215L303 185L260 245" fill="#647650" stroke="#3f5940" stroke-width="3"/><path d="M140 270L95 245L140 292M260 305L303 275L260 335" fill="#647650" stroke="#3f5940" stroke-width="3"/><path d="M140 370L95 345L140 392M260 405L303 375L260 435" fill="#647650" stroke="#3f5940" stroke-width="3"/><ellipse cx="550" cy="200" rx="16" ry="12" fill="#797b69" stroke="#5b6256" stroke-width="3"/><ellipse cx="625" cy="260" rx="16" ry="12" fill="#797b69" stroke="#5b6256" stroke-width="3"/><ellipse cx="565" cy="350" rx="16" ry="12" fill="#797b69" stroke="#5b6256" stroke-width="3"/><ellipse cx="635" cy="400" rx="16" ry="12" fill="#797b69" stroke="#5b6256" stroke-width="3"/><text x="85" y="520" font-size="24">幼木・若い枝：鋭い刺</text><text x="445" y="520" font-size="24">成長した幹：脱落跡の例</text><text x="25" y="575" font-size="20">刺の有無だけで同定しません。老木がすべて無刺とは限りません。</text></g></svg>