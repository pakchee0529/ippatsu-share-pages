<svg xmlns="http://www.w3.org/2000/svg" width="560" height="378" viewBox="0 0 560 378"><title>T-7確認用・通過確認から保持へ</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44730"/></marker></defs><rect width="560" height="378" rx="14" fill="#f3f7ef"/><g font-family="sans-serif" fill="#243b2e"><text x="18" y="32" font-size="20">先端を完全に出す → たるみを取る → 保持</text><rect x="185" y="102" width="190" height="90" rx="18" fill="#edbd75" stroke="#6b6c56" stroke-width="3"/><path d="M143 147H185M375 147H399" stroke="#636b68" stroke-width="8"/><circle cx="125" cy="147" r="18" fill="none" stroke="#636b68" stroke-width="7"/><text x="211" y="156" font-size="18">本体（模式）</text><path d="M20 147H535" stroke="#64787c" stroke-width="6"/><path d="M98 218L28 218" stroke="#b44730" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="24" y="252" font-size="20">先端が出て、軽く引けることを確認</text><rect x="28" y="278" width="504" height="72" rx="12" fill="white" stroke="#84a38b"/><text x="45" y="308" font-size="22">その後で解放レバーを元へ戻す</text><text x="45" y="335" font-size="16">荷重中に解放するためのレバーではありません</text></g></svg>