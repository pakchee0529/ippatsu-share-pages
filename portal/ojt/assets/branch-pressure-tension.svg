<svg xmlns="http://www.w3.org/2000/svg" width="560" height="515" viewBox="0 0 560 515"><title>支え方で押される側と引かれる側が変わる</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34332"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#347eaa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#437b55"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#666"/></marker></defs><rect width="560" height="515" rx="15" fill="#f2f6ed"/><g font-family="sans-serif" fill="#263e30"><text x="20" y="30" font-size="23" fill="#263e30">自重で下へたわむ二つの例</text><text x="20" y="72" font-size="22" fill="#263e30">両端支持：中央付近</text><path d="M85 169L108 126L131 169M429 169L452 126L475 169" fill="none" stroke="#437b55" stroke-width="5"/><rect x="106" y="103" width="348" height="15" fill="#b78052"/><rect x="106" y="118" width="348" height="15" fill="#64a4c5"/><path d="M280 66L280 97" fill="none" stroke="#666" stroke-width="4" marker-end="url(#gray)"/><text x="159" y="202" font-size="19" fill="#263e30">上：押される／下：引かれる</text><text x="20" y="270" font-size="22" fill="#263e30">片持ち：固定部近く</text><rect x="55" y="303" width="36" height="94" fill="#76816c"/><rect x="90" y="325" width="360" height="15" fill="#64a4c5"/><rect x="90" y="340" width="360" height="15" fill="#b78052"/><path d="M435 277L435 317" fill="none" stroke="#666" stroke-width="4" marker-end="url(#gray)"/><text x="159" y="413" font-size="19" fill="#263e30">上：引かれる／下：押される</text><text x="20" y="457" font-size="18" fill="#263e30">押される側は切口が閉じ、刃を挟むことがある</text><text x="20" y="488" font-size="16" fill="#263e30">単純な自重モデル。切込位置・深さ・順序の指示ではありません</text></g></svg>