<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img"><title>手動エンドレスウインチの原理</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b44730"/></marker></defs><rect width="560" height="360" rx="15" fill="#f4f7ef"/><g font-family="sans-serif" fill="#223d2b" font-size="20"><text x="22" y="32" font-size="22">ワイヤーを巻き取らず、つかんで少しずつ送る</text><rect x="105" y="74" width="348" height="174" rx="35" fill="#edb15d" stroke="#755b37" stroke-width="3"/><path d="M20 160H535" stroke="#687777" stroke-width="10"/><rect x="155" y="118" width="76" height="29" rx="5" fill="#4f8d70" stroke="#345347"/><rect x="155" y="174" width="76" height="29" rx="5" fill="#4f8d70" stroke="#345347"/><rect x="302" y="118" width="76" height="29" rx="5" fill="#a7c4b2" stroke="#345347"/><rect x="302" y="174" width="76" height="29" rx="5" fill="#a7c4b2" stroke="#345347"/><text x="150" y="104" font-size="20">つかみ A</text><text x="299" y="104" font-size="20">つかみ B</text><text x="269" y="232" font-size="17">つかみの概念</text><text x="45" y="286" font-size="20">二組のつかみが交互に働く考え方</text><text x="45" y="321" font-size="17">実物の内部形状・操作位置を示す図ではありません</text></g></svg>