<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640"><rect width="520" height="640" rx="16" fill="#f1f5ef"/><g font-family="sans-serif" fill="#203a2b"><rect x="15" y="15" width="490" height="140" rx="13" fill="white" stroke="#9db49d"/><circle cx="45" cy="48" r="13" fill="#39785b"/><text x="72" y="58" font-size="26" font-weight="bold">支柱・踏ざん</text><text x="35" y="100" font-size="23">支柱：全体の骨組み</text><text x="35" y="132" font-size="23">踏ざん：足を置く・握る場所</text><rect x="15" y="170" width="490" height="140" rx="13" fill="white" stroke="#9db49d"/><circle cx="45" cy="203" r="13" fill="#39785b"/><text x="72" y="213" font-size="26" font-weight="bold">連結部</text><text x="35" y="255" font-size="23">部材どうしをつなぐ部分</text><text x="35" y="287" font-size="23">接続により長さが変わる</text><rect x="15" y="325" width="490" height="140" rx="13" fill="white" stroke="#9db49d"/><circle cx="45" cy="358" r="13" fill="#39785b"/><text x="72" y="368" font-size="26" font-weight="bold">端部の金具</text><text x="35" y="410" font-size="23">幹・地面に当たる側の部品</text><text x="35" y="442" font-size="23">接触面の位置や状態に関わる</text><rect x="15" y="480" width="490" height="140" rx="13" fill="white" stroke="#9db49d"/><circle cx="45" cy="513" r="13" fill="#39785b"/><text x="72" y="523" font-size="26" font-weight="bold">幹への固定</text><text x="35" y="565" font-size="23">はしごの動きを抑える仕組み</text><text x="35" y="597" font-size="23">人の墜落防止とは役割が別</text></g></svg>