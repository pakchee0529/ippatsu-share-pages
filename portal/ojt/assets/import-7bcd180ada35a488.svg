<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040" width="800" height="1040"><title>黄櫨漆の呼称未確定：ハゼノキ・ヤマハゼ・ヤマウルシの比較模式図</title><rect width="100%" height="100%" fill="#f5f7ee"/><g font-family="Meiryo,sans-serif" fill="#243d2a"><text x="25" y="38" font-size="28">黄櫨漆：呼称未確定／3種の比較補助</text><text x="25" y="72" font-size="20">すべて模式図。実写・本人の樹木の同定結果ではありません。</text><text x="25" y="110" font-size="27">ハゼノキ</text><path d="M170 310V145" stroke="#63834c" stroke-width="6"/><ellipse cx="122" cy="175" rx="43" ry="13" transform="rotate(-25 122 175)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="175" rx="43" ry="13" transform="rotate(25 218 175)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="122" cy="220" rx="43" ry="13" transform="rotate(-25 122 220)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="220" rx="43" ry="13" transform="rotate(25 218 220)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="122" cy="265" rx="43" ry="13" transform="rotate(-25 122 265)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="265" rx="43" ry="13" transform="rotate(25 218 265)" fill="#739759" stroke="#3d643c" stroke-width="2"/><path d="M170 165Q155 140 170 120Q185 140 170 165" fill="#739759" stroke="#3d643c" stroke-width="2"/><text x="300" y="155" font-size="21">羽状複葉全体（葉数は模式）</text><path d="M350 260Q390 215 500 240Q450 315 350 260Z" fill="#739759" stroke="#3d643c" stroke-width="2"/><path d="M355 260L493 242" stroke="#c2d4a1" stroke-width="2"/><text x="300" y="330" font-size="20">ほぼ無毛／細身で先が伸びる</text><text x="25" y="370" font-size="27">ヤマハゼ</text><path d="M170 570V405" stroke="#63834c" stroke-width="6"/><ellipse cx="122" cy="435" rx="43" ry="13" transform="rotate(-25 122 435)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="435" rx="43" ry="13" transform="rotate(25 218 435)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="122" cy="480" rx="43" ry="13" transform="rotate(-25 122 480)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="480" rx="43" ry="13" transform="rotate(25 218 480)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="122" cy="525" rx="43" ry="13" transform="rotate(-25 122 525)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="525" rx="43" ry="13" transform="rotate(25 218 525)" fill="#739759" stroke="#3d643c" stroke-width="2"/><path d="M170 425Q155 400 170 380Q185 400 170 425" fill="#739759" stroke="#3d643c" stroke-width="2"/><text x="300" y="415" font-size="21">羽状複葉全体（葉数は模式）</text><path d="M350 520Q390 475 500 500Q450 575 350 520Z" fill="#739759" stroke="#3d643c" stroke-width="2"/><path d="M355 520L493 502" stroke="#c2d4a1" stroke-width="2"/><text x="300" y="590" font-size="20">両面に毛／ハゼノキに似た形</text><text x="25" y="630" font-size="27">ヤマウルシ</text><path d="M170 830V665" stroke="#995e51" stroke-width="6"/><ellipse cx="122" cy="695" rx="43" ry="20" transform="rotate(-25 122 695)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="695" rx="43" ry="20" transform="rotate(25 218 695)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="122" cy="740" rx="43" ry="20" transform="rotate(-25 122 740)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="740" rx="43" ry="20" transform="rotate(25 218 740)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="122" cy="785" rx="43" ry="20" transform="rotate(-25 122 785)" fill="#739759" stroke="#3d643c" stroke-width="2"/><ellipse cx="218" cy="785" rx="43" ry="20" transform="rotate(25 218 785)" fill="#739759" stroke="#3d643c" stroke-width="2"/><path d="M170 685Q145 660 170 640Q195 660 170 685" fill="#739759" stroke="#3d643c" stroke-width="2"/><text x="300" y="675" font-size="21">羽状複葉全体（葉数は模式）</text><path d="M350 780Q390 715 500 760Q450 855 350 780Z" fill="#739759" stroke="#3d643c" stroke-width="2"/><path d="M355 780L493 762" stroke="#c2d4a1" stroke-width="2"/><text x="300" y="850" font-size="20">比較的丸い卵形／先は尖る</text><text x="300" y="878" font-size="18">毛あり・位置は資料差／赤褐色葉軸は補助</text><text x="25" y="930" font-size="18">若葉の鋸歯・成熟葉の全縁など変化もあります。毛や色1つで決めません。</text><text x="25" y="965" font-size="19">ハゼノキ以外の樹皮は未確保。</text><text x="25" y="1000" font-size="19">確認のために触る・傷つける・折ることは勧めません。</text></g></svg>