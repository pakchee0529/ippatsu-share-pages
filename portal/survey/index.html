<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現調待ち一覧</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
:root {
  --bg: #f4f5f7;
  --card: #fff;
  --text: #1a1a1a;
  --muted: #5c6370;
  --border: #e1e4e8;
  --accent: #2563eb;
  --accent2: #0d9488;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans",
    "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 0.75rem 0.75rem 1.25rem;
  max-width: 40rem;
  margin-left: auto;
  margin-right: auto;
}
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 0.75rem;
  margin-bottom: 0.75rem;
}
.top-bar a {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  padding: 0.35rem 0.5rem;
  border-radius: 6px;
}
.top-bar a:hover, .top-bar a:focus-visible {
  text-decoration: underline;
  outline: none;
}
.page-title {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0 0 0.35rem;
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
}
.lead {
  margin: 0 0 0.5rem;
  font-size: 0.9rem;
  color: var(--muted);
}
.report-disclaimer {
  margin: 0 0 0.75rem;
  padding: 0.55rem 0.65rem;
  font-size: 0.82rem;
  line-height: 1.45;
  color: var(--muted);
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.card {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 0.85rem 1rem;
  margin-bottom: 0.75rem;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.item-mgmt {
  margin: -0.15rem 0 0;
  font-size: 0.82rem;
  color: var(--muted);
  font-weight: 600;
}
.card-head {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}
.card-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0;
}
.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.45rem 0.75rem;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  min-height: 40px;
  touch-action: manipulation;
}
.btn-map {
  background: var(--accent);
  color: #fff;
}
.btn-map:hover, .btn-map:focus { filter: brightness(1.05); }
.btn-note {
  background: #fff;
  color: var(--accent2);
  border: 2px solid var(--accent2);
}
.btn-note[aria-expanded="true"] {
  background: var(--accent2);
  color: #fff;
}
.note-panel {
  margin-top: 0.65rem;
  padding: 0.65rem 0.75rem;
  background: #f8fafc;
  border-radius: 8px;
  border: 1px dashed var(--border);
  font-size: 0.92rem;
  color: var(--text);
}
.note-panel[hidden] { display: none !important; }
.two-map-wrap {
  margin-top: 0.65rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.two-map-wrap[hidden] { display: none !important; }
.share-two-map-canvas {
  width: 100%;
  height: min(45vh, 320px);
  min-height: 200px;
}
.leaflet-tooltip.two-tip {
  font-weight: 600;
  font-size: 0.85rem;
  padding: 2px 6px;
  border: none;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.map-section {
  margin-top: 1.0rem;
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 0.75rem 1rem 1rem;
  margin-bottom: 0.85rem;
}
.map-section h2 {
  font-size: 1.05rem;
  margin: 0 0 0.5rem;
}
#share-map {
  width: 100%;
  height: min(55vh, 420px);
  min-height: 220px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.map-empty .muted-tiny {
  margin: 0;
  font-size: 0.88rem;
  color: var(--muted);
}
.leaflet-container { font-family: inherit; }
.muted-tiny {
  font-size: 0.88rem;
  color: var(--muted);
}
.footer-note {
  margin-top: 1.1rem;
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
}
@media (min-width: 480px) {
  .card-head {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
  }
  .page-title { font-size: 1.4rem; }
}
.card-actions-report {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  flex-basis: 100%;
  width: 100%;
  margin-top: 0.35rem;
  padding-top: 0.55rem;
  border-top: 1px dashed var(--border);
}
.card-actions-report .btn {
  flex: 1 1 calc(50% - 0.25rem);
  min-width: 9.5rem;
  min-height: 44px;
  font-size: 0.88rem;
}
.btn-report-done {
  background: var(--accent);
  color: #fff;
}
.btn-report-done:hover, .btn-report-done:focus-visible {
  filter: brightness(1.05);
  outline: none;
}
.btn-report-return {
  background: #fffbeb;
  color: #92400e;
  border: 2px solid #f59e0b;
}
.btn-report-return:hover, .btn-report-return:focus-visible {
  background: #fef3c7;
  outline: none;
}
</style>
</head>
<body>
  <nav class="top-bar" aria-label="サイト内リンク">
    <a href="../">ポータルTOP</a>
    <a href="./">現調待ち</a>
    <a href="../archive/">アーカイブ</a>
  </nav>
  <h1 class="page-title">現調待ち一覧</h1>
  <p class="lead">径間ごとに地図・現場指示・報告用のリンクがあります。</p>
  <p class="report-disclaimer">報告ボタンは Google フォームに送信します。送信後、PC側で確認して反映します。押しただけではこの一覧から消えません。</p>
  <main>
<p class="muted-tiny">現調待ちリストはまだありません。</p>
  <section class="map-section map-empty" aria-labelledby="map-heading">
    <h2 id="map-heading">全体地図</h2>
    <p class="muted-tiny">まとめて表示できる位置情報がありません。</p>
  </section>

  </main>
  <p class="footer-note">このページは <code>scripts/generate_portal.py</code> で再生成できます。</p>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script>
(function () {
  document.querySelectorAll("[data-note-toggle]").forEach(function(btn) {
    var id = btn.getAttribute("aria-controls");
    var panel = id ? document.getElementById(id) : null;
    if (!panel) return;
    btn.addEventListener("click", function() {
      var open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", open ? "false" : "true");
      panel.hidden = open;
    });
  });
  function gmaps(lat, lng) {
    return "https://www.google.com/maps?q=" + encodeURIComponent(lat + "," + lng);
  }
  var twoMaps = Object.create(null);
  document.querySelectorAll("[data-two-open]").forEach(function(btn) {
    var wrapId = btn.getAttribute("data-two-wrap");
    var mapId = btn.getAttribute("data-two-map");
    var jsonId = btn.getAttribute("data-two-json");
    var wrap = wrapId ? document.getElementById(wrapId) : null;
    var jsonEl = jsonId ? document.getElementById(jsonId) : null;
    if (!wrap || !jsonEl) return;
    btn.addEventListener("click", function() {
      var nowOpen = btn.getAttribute("aria-expanded") === "true";
      wrap.hidden = nowOpen;
      btn.setAttribute("aria-expanded", nowOpen ? "false" : "true");
      btn.textContent = nowOpen ? "2点地図を開く" : "2点地図を閉じる";
      if (nowOpen) return;
      var geo = null;
      try {
        geo = JSON.parse(jsonEl.textContent || "{}");
      } catch (e) {
        return;
      }
      if (!geo || !geo.a || !geo.b) return;
      var key = mapId;
      if (!twoMaps[key]) {
        var mmap = L.map(mapId, { scrollWheelZoom: false });
        twoMaps[key] = mmap;
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors",
        }).addTo(mmap);
      }
      var mmap = twoMaps[key];
      mmap.eachLayer(function(layer) {
        if (layer instanceof L.Marker || layer instanceof L.Polyline) mmap.removeLayer(layer);
      });
      function addPoint(p, cls) {
        var lat = Number(p.lat), lng = Number(p.lng);
        if (!isFinite(lat) || !isFinite(lng)) return null;
        var m = L.marker([lat, lng]).addTo(mmap);
        if (p.name) m.bindTooltip(String(p.name), { permanent: true, direction: "top", className: cls });
        m.on("click", function() { window.open(gmaps(lat, lng), "_blank", "noopener,noreferrer"); });
        return [lat, lng];
      }
      var a = addPoint(geo.a, "two-tip");
      var b = addPoint(geo.b, "two-tip");
      var pts = [];
      if (a) pts.push(a);
      if (b) pts.push(b);
      if (pts.length === 2) L.polyline(pts, { weight: 3, opacity: 0.8 }).addTo(mmap);
      if (pts.length === 1) mmap.setView(pts[0], 15);
      else if (pts.length > 1) mmap.fitBounds(pts, { padding: [24, 24], maxZoom: 16 });
      setTimeout(function() { mmap.invalidateSize(); }, 60);
    });
  });
  var points = [];
  var mapEl = document.getElementById("share-map");
  if (mapEl && Array.isArray(points) && points.length) {
    var map = L.map("share-map", { scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    var bounds = [];
    points.forEach(function(p) {
      var lat = Number(p.lat), lng = Number(p.lng);
      if (!isFinite(lat) || !isFinite(lng)) return;
      bounds.push([lat, lng]);
      var m = L.marker([lat, lng]).addTo(map);
      var label = (p.name || "現場") + (p.management_no ? (" (" + p.management_no + ")") : "");
      m.bindTooltip(label, { permanent: false, direction: "top" });
    });
    if (bounds.length === 1) map.setView(bounds[0], 15);
    else if (bounds.length > 1) map.fitBounds(bounds, { padding: [28, 28], maxZoom: 16 });
  }
})();
  </script>
</body>
</html>
