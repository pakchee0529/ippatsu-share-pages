<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付託待ち</title>
<style>
:root {
  --bg: #eef1f5;
  --card: #fff;
  --text: #172033;
  --muted: #657084;
  --border: #d9e0ea;
  --accent: #1f4f7a;
  --shadow: 0 10px 26px rgba(31, 43, 58, .08);
  --survey: #2563eb;
  --negotiation: #7c3aed;
  --entrustment: #0f766e;
  --construction: #b45309;
  --return: #b91c1c;
}
* { box-sizing: border-box; }
body {
  margin: 0 auto;
  max-width: 46rem;
  padding: 0.75rem 0.75rem 1.25rem;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

.portal-page-header {
  margin-bottom: 0.35rem;
}
.portal-page-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
}
.portal-page-header-row .page-title {
  flex: 1;
  min-width: 0;
  margin: 0 0 0.35rem;
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
}
.portal-menu-wrap {
  position: relative;
  flex-shrink: 0;
}
.portal-menu-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  min-height: 48px;
  min-width: 48px;
  padding: 0.45rem 0.65rem;
  font-size: 0.95rem;
  font-weight: 600;
  font-family: inherit;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(20, 32, 51, 0.06);
}
.portal-menu-btn:hover,
.portal-menu-btn:focus-visible {
  border-color: var(--accent);
  outline: none;
}
.portal-menu-icon {
  font-size: 1.15rem;
  line-height: 1;
}
.portal-menu-label {
  white-space: nowrap;
}
.portal-menu-panel {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 30;
  min-width: 12.5rem;
  padding: 0.35rem 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 4px 14px rgba(20, 32, 51, 0.12);
}
.portal-menu-panel[hidden] {
  display: none !important;
}
.portal-menu-item {
  display: block;
  padding: 0.75rem 1rem;
  font-size: 0.95rem;
  color: var(--text);
  text-decoration: none;
  border: 0;
  background: transparent;
  width: 100%;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
}
a.portal-menu-item:hover,
a.portal-menu-item:focus-visible {
  background: #f1f5f9;
  outline: none;
}
.portal-menu-item.is-current {
  font-weight: 700;
  background: #f1f5f9;
}

.lead {
  margin: 0 0 0.9rem;
  color: var(--muted);
  font-size: 0.92rem;
}
.status-navigation {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin: 0 0 0.85rem;
}
.status-navigation a {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 0.42rem 0.72rem;
  border-radius: 999px;
  border: 1px solid #c9d5e6;
  background: #fff;
  color: var(--accent);
  font-size: 0.86rem;
  font-weight: 800;
  text-decoration: none;
}
.case-toolbar {
  position: sticky;
  top: 0.5rem;
  z-index: 5;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.65rem;
  align-items: center;
  margin: 0 0 0.9rem;
  padding: 0.65rem;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: rgba(255,255,255,.94);
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}
.case-search {
  width: 100%;
  min-height: 2.8rem;
  padding: 0.75rem 0.9rem;
  border: 1px solid #b9c4d3;
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  font-size: 1rem;
}
.case-search:focus {
  outline: 3px solid rgba(31,79,122,.18);
  border-color: var(--accent);
}
.case-total {
  min-width: 5.4rem;
  padding: 0.65rem 0.75rem;
  border-radius: 12px;
  background: #172033;
  color: #fff;
  text-align: center;
  font-weight: 800;
}
.case-total span {
  display: block;
  color: #cbd5e1;
  font-size: 0.72rem;
  font-weight: 700;
}
.case-card {
  display: flex;
  justify-content: space-between;
  gap: 0.85rem;
  align-items: flex-start;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 0.9rem 1rem;
  margin-bottom: 0.68rem;
  box-shadow: 0 2px 8px rgba(31,43,58,.045);
}
.case-card[hidden] {
  display: none;
}
.case-card-main { min-width: 0; }
.case-status-pill {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  padding: 0.18rem 0.52rem;
  border-radius: 999px;
  color: #fff;
  font-size: 0.75rem;
  font-weight: 800;
  line-height: 1.35;
}
.case-status-pill.status-entrustment_wait {
  background: var(--entrustment);
}
.case-title {
  margin: 0.35rem 0 0;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.case-meta, .case-note {
  margin: 0.25rem 0 0;
  color: var(--muted);
  font-size: 0.86rem;
}
.case-meta {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  padding: 0.14rem 0.45rem;
  border-radius: 999px;
  background: #eef2f7;
  color: #243044;
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-weight: 700;
}
.card-actions {
  flex: 0 0 auto;
  display: flex;
  gap: 0.5rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0.45rem 0.75rem;
  border-radius: 8px;
  background: #eaf2ff;
  color: #174ea6;
  font-weight: 700;
  text-decoration: none;
  border: 1px solid #bfd4ff;
}
.empty-note {
  margin: 1rem 0;
  padding: 0.9rem 1rem;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.filter-empty {
  display: none;
  margin: 0.75rem 0 1rem;
  padding: 0.9rem 1rem;
  border: 1px dashed #b9c4d3;
  border-radius: 14px;
  background: #fff;
  color: var(--muted);
  text-align: center;
}
.filter-empty.is-visible {
  display: block;
}
.footer-note {
  margin: 1rem 0 0;
  color: var(--muted);
  font-size: 0.82rem;
  text-align: center;
}
@media (max-width: 520px) {
  body { padding: 0.55rem 0.55rem 1rem; }
  .case-toolbar { grid-template-columns: 1fr; }
  .case-total { min-width: 0; }
  .status-navigation a { flex: 1 1 calc(50% - 0.25rem); justify-content: center; }
  .case-card { flex-direction: column; }
  .card-actions, .btn { width: 100%; }
}
</style>
</head>
<body>
  <header class="portal-page-header">
    <div class="portal-page-header-row">
      <h1 class="page-title">付託待ち</h1>
      <div class="portal-menu-wrap">
        <button type="button" class="portal-menu-btn" id="portal-menu-btn" aria-expanded="false" aria-haspopup="true" aria-controls="portal-menu-panel" aria-label="サイトメニューを開く">
          <span class="portal-menu-icon" aria-hidden="true">☰</span>
          <span class="portal-menu-label">メニュー</span>
        </button>
        <nav id="portal-menu-panel" class="portal-menu-panel" role="menu" hidden>
          <a class="portal-menu-item" role="menuitem" href="../">ポータルTOP</a>
          <a class="portal-menu-item" role="menuitem" href="../calendar/">社内カレンダー</a>
          <a class="portal-menu-item" role="menuitem" href="../survey/">現調待ち</a>
          <a class="portal-menu-item" role="menuitem" href="../negotiation/">交渉待ち</a>
          <a class="portal-menu-item is-current" role="menuitem" href="./" aria-current="page">付託待ち</a>
          <a class="portal-menu-item" role="menuitem" href="../cases/">案件管理</a>
          <a class="portal-menu-item" role="menuitem" href="../archive/">アーカイブ</a>
        </nav>
      </div>
    </div>
  </header>
<main>
  <p class="lead">付託待ちのCSを確認する閲覧専用ページです。地主名・住所・連絡先などの個人情報は表示しません。</p>
  <nav class="status-navigation" aria-label="関連ページ">
    <a href="../cases/#status-entrustment_wait">案件管理で見る</a>
    <a href="../negotiation/">交渉待ちへ</a>
  </nav>
  <div class="case-toolbar" role="search">
    <input id="caseSearch" class="case-search" type="search" placeholder="管理番号・径間名で検索" autocomplete="off">
    <div class="case-total"><span>表示</span><strong id="caseVisibleCount">0</strong></div>
  </div>
  <p id="caseFilterEmpty" class="filter-empty">一致する案件はありません。</p>
  <div class="card-list" role="list">
<p class="empty-note">付託待ちリストはまだありません。</p>
  </div>
</main>
<p class="footer-note">このページは <code>scripts/generate_portal.py --mode entrustment-only</code> で再生成できます。</p>
<script>

(function () {
  var btn = document.getElementById("portal-menu-btn");
  var panel = document.getElementById("portal-menu-panel");
  if (!btn || !panel) return;
  function setOpen(open) {
    panel.hidden = !open;
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  btn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    setOpen(panel.hidden);
  });
  document.addEventListener("click", function () {
    setOpen(false);
  });
  panel.addEventListener("click", function (ev) {
    ev.stopPropagation();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") setOpen(false);
  });
})();

(() => {
  const input = document.getElementById("caseSearch");
  const visibleCount = document.getElementById("caseVisibleCount");
  const empty = document.getElementById("caseFilterEmpty");
  const rows = Array.from(document.querySelectorAll(".case-card"));
  function applyFilter() {
    const q = (input.value || "").trim().toLowerCase();
    let visible = 0;
    rows.forEach((row) => {
      const haystack = (row.dataset.search || row.textContent || "").toLowerCase();
      const hit = !q || haystack.includes(q);
      row.hidden = !hit;
      if (hit) visible += 1;
    });
    if (visibleCount) visibleCount.textContent = String(visible);
    if (empty) empty.classList.toggle("is-visible", visible === 0);
  }
  if (input) input.addEventListener("input", applyFilter);
})();
</script>
</body>
</html>
