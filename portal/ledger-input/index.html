<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>写真台帳入力</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f6f8fa;color:#172033}h1{font-size:1.3rem}section{background:#fff;border:1px solid #d8dee8;border-radius:10px;padding:12px;margin:10px 0}label{display:block;font-weight:700;margin-top:8px}input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:9px;border:1px solid #94a3b8;border-radius:7px}textarea{min-height:62px}small{color:#475569}button{font:inherit;font-weight:700;padding:11px 14px;border:0;border-radius:8px;background:#047857;color:#fff;margin:8px 8px 0 0}.warn{color:#9a3412;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style>
<h1>写真台帳入力</h1><p id="case"></p><p><small>この画面は端末内でJSONを作るだけです。Supabase・写真原本は変更しません。</small></p><label>設計番号</label><input id="design" placeholder="例: B 6186">
<section><h2>前後採用写真</h2><small>BA／竹／柴／つるを「前-後」で、複数組はカンマ区切り。例: <code>001-005,003-007</code></small><label>伐採前後 (BA)</label><input id="BA"><label>竹伐採前後 (TK)</label><input id="TK"><label>柴伐採前後 (SB)</label><input id="SB"><label>つる伐採前後 (TR)</label><input id="TR"></section>
<section><h2>枝切り・根切り</h2><small>E10/N10 は「開始写真:写真ごとの本数」。複数中断は <code>001:2,2;015:1,2</code>。それ以外は写真番号をカンマ区切りで入力。</small><div id="cuts" class="grid"></div></section>
<section><h2>運搬・特殊</h2><label>運搬・指定場所運搬</label><textarea id="transport" placeholder="例: 運搬 2t車:090,091&#10;指定場所運搬 軽四輪:092"></textarea><label>倒木実費・自由記述</label><textarea id="special" placeholder="例: 倒木実費:100,101&#10;崖のため伐採不可:102"></textarea></section>
<p id="message" class="warn"></p><button id="download">指示書JSONを保存</button>
<script>
(()=>{const q=new URLSearchParams(location.search), codes=['E10','E20','E30','E40','E50','E60','N10','N20','N30','N40','N50','N60'];const mno=q.get('management_no')||'',label=q.get('label')||'';document.querySelector('#case').textContent=`${mno}　${label}`;const cuts=document.querySelector('#cuts');for(const c of codes){const n=Number(q.get(c)||0),u=c==='E10'||c==='N10';cuts.insertAdjacentHTML('beforeend',`<label>${c}（予定 ${n}）<input id="${c}" placeholder="${u?'001:2,2;015:1':'001,002'}"></label>`)}function no(v){if(!/^\d{1,3}$/.test(v.trim()))throw Error('写真番号は1〜3桁の数字です');return v.trim().padStart(3,'0')}function pairs(v){if(!v.trim())return[];return v.split(',').map(x=>{let a=x.trim().split('-');if(a.length!==2)throw Error('前後は 001-005 の形式です');return{before:no(a[0]),after:no(a[1])}})}function cut(c){let v=document.querySelector('#'+c).value.trim();if(!v)return[];if(c==='E10'||c==='N10')return v.split(';').map(x=>{let a=x.trim().split(':');if(a.length!==2)throw Error(c+' は 001:2,2 の形式です');let counts=a[1].split(',').map(n=>Number(n.trim()));if(counts.some(n=>!Number.isInteger(n)||n<1))throw Error(c+' の本数は1以上です');return{start_photo:no(a[0]),counts}});return v.split(',').map(no)}function lines(v){return v.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let a=x.split(':');return{label:a[0].trim(),photos:(a[1]||'').split(',').map(s=>s.trim()).filter(Boolean).map(no)}})}document.querySelector('#download').onclick=()=>{try{let d={schema:'ippatsu-photo-ledger-instruction/v1',created_at:new Date().toISOString(),case:{share_date_key:q.get('date')||'',design_no:document.querySelector('#design').value.trim(),management_no:mno,span_label:label,planned:{}},pairs:{},cuts:{},transport:lines(document.querySelector('#transport').value),special:lines(document.querySelector('#special').value)};for(const c of codes){d.case.planned[c]=Number(q.get(c)||0);d.cuts[c]=cut(c)}for(const c of ['BA','TK','SB','TR'])d.pairs[c]=pairs(document.querySelector('#'+c).value);let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${q.get('date')||'date'}_${mno}_写真台帳指示.json`;a.click();URL.revokeObjectURL(a.href);document.querySelector('#message').textContent='保存しました。帰社後にPCの写真台帳入力でこのJSONを選びます。'}catch(e){document.querySelector('#message').textContent=e.message}}</script>
