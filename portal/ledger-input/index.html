<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真台帳入力</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f6f8fa;color:#172033}h1{font-size:1.3rem}h2{font-size:1.05rem;margin:0 0 8px}section{background:#fff;border:1px solid #d8dee8;border-radius:10px;padding:12px;margin:10px 0}label{display:block;font-weight:700;margin-top:8px}input,textarea,select{font:inherit;width:100%;box-sizing:border-box;padding:9px;border:1px solid #94a3b8;border-radius:7px}textarea{min-height:62px}small,.note{color:#475569}.choice{background:#fff;color:#172033;border:1px solid #94a3b8}.choice[aria-pressed=true]{background:#dcfce7;border-color:#15803d;color:#14532d}button{font:inherit;font-weight:700;padding:9px 11px;border:0;border-radius:8px;background:#047857;color:#fff;margin:7px 6px 0 0}.secondary,.key{background:#e2e8f0;color:#172033}.hidden{display:none}.pair,.transport-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.run,.transport-row{border-top:1px solid #d8dee8;margin-top:10px;padding-top:10px}.transport-check{display:flex;align-items:center;gap:6px;margin-top:8px}.transport-check input{width:auto}.counts{padding:8px;background:#f1f5f9;border-radius:7px;min-height:22px}.keys{display:grid;grid-template-columns:repeat(3,70px);gap:5px;margin-top:8px}.key{margin:0;border:1px solid #94a3b8}.enter{background:#047857;color:#fff}.status,.message{font-weight:700;margin:8px 0}.short{color:#b91c1c}.ok{color:#15803d}.added{color:#0369a1}.warn{color:#9a3412}.footer{position:sticky;bottom:0;background:#f6f8fa;padding:8px 0}@media(max-width:460px){.pair,.transport-row{grid-template-columns:1fr}.keys{grid-template-columns:repeat(3,1fr)}}
</style>
<h1>写真台帳入力</h1><p id="case"></p><p><small>端末内で下書き・JSONを作るだけです。Supabaseと写真原本は変更しません。</small></p><label>設計番号<input id="design" placeholder="例: B 6186"></label><section><h2>入力する項目を選ぶ</h2><div id="choices"></div></section><main id="form"></main><p id="message" class="message" aria-live="polite"></p><div class="footer"><button id="save" class="secondary">端末に下書き保存</button><button id="clear" class="secondary">下書きを削除</button><button id="download">指示書JSONを保存</button></div>
<script>
(()=>{const q=new URLSearchParams(location.search),codes=['BA','E10','E20','E30','E40','E50','E60','N10','N20','N30','N40','N50','N60','TK','TR','SB','US','DF','FR'],cuts=codes.filter(x=>/^[EN]\d\d$/.test(x)),pairs=['BA','TK','TR','SB'],mno=q.get('management_no')||'',span=q.get('label')||'',form=document.querySelector('#form'),choices=document.querySelector('#choices'),message=document.querySelector('#message'),plan=Object.fromEntries(cuts.map(c=>[c,Number(q.get(c)||0)])),draftKey='ippatsu-photo-ledger-draft:'+[q.get('date')||'',mno,span].join(':');document.querySelector('#case').textContent=`${mno}　${span}`;const label={BA:'伐採前後',E10:'E10',E20:'E20',E30:'E30',E40:'E40',E50:'E50',E60:'E60',N10:'N10',N20:'N20',N30:'N30',N40:'N40',N50:'N50',N60:'N60',TK:'竹伐採前後',TR:'つる伐採前後',SB:'柴伐採前後',US:'運搬',DF:'倒木実費',FR:'自由記述'};
function no(v){v=String(v||'').trim();if(!/^\d{1,3}$/.test(v))throw Error('写真番号は1〜3桁の数字です');return v.padStart(3,'0')}function photoList(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean).map(no)}function on(){return [...choices.querySelectorAll('[aria-pressed=true]')].map(x=>x.dataset.code)}function part(rows,target){let p=new Map([[0,[]]]);rows.forEach((r,i)=>[...p].forEach(([s,a])=>{let n=s+r.count;if(n<=target&&!p.has(n))p.set(n,[...a,i])}));let exact=p.has(target),set=new Set(p.get(exact?target:Math.max(...p.keys())));return{exact,planned:rows.filter((_,i)=>set.has(i)),added:rows.filter((_,i)=>!set.has(i)}}
function pairRow(a='',b=''){return `<div class="pair"><label>前<input class="before" inputmode="numeric" value="${a}"></label><label>後<input class="after" inputmode="numeric" value="${b}"></label></div>`}function runRow(s='',v=[]){return `<div class="run" data-counts="${v.join(',')}"><label>開始写真番号<input class="start" inputmode="numeric" value="${s}" placeholder="001"></label><label>写真ごとの本数</label><div class="counts"></div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key" data-key="${n}">${n}</button>`).join('')}<button type="button" class="key" data-key="back">⌫</button><button type="button" class="key" data-key="0">0</button><button type="button" class="key enter" data-key="enter">確定</button></div><small class="pending"></small></div>`}function transportRow(vehicle='軽四輪',specified=false,photos=''){return `<div class="transport-row"><label>車種<select class="vehicle"><option ${vehicle==='軽四輪'?'selected':''}>軽四輪</option><option ${vehicle==='2t車'?'selected':''}>2t車</option></select></label><label>写真番号（カンマ区切り）<input class="transport-photos" inputmode="numeric" value="${photos}"></label><label class="transport-check"><input class="specified" type="checkbox" ${specified?'checked':''}>指定場所運搬にする</label></div>`}
function html(c){if(pairs.includes(c))return `<section data-s="${c}"><h2>${label[c]}</h2><small>採用する組だけ入力します。</small><div class="pair-list">${pairRow()}</div><button type="button" class="secondary add-pair">＋ 前後1組を追加</button>${c==='TK'?'<label>BA流用する組番号（例: 1,2）<input class="reuse" inputmode="numeric"></label><p class="note">指定したBA組だけを竹伐採前後にも使います。</p>':''}</section>`;if(c==='E10'||c==='N10')return `<section data-s="${c}"><h2>${c} <span class="status summary"></span></h2><small>写真ごとの本数をテンキーで確定。写真番号が飛ぶ時だけ続きの写真を追加。</small><div class="runs">${runRow()}</div><button type="button" class="secondary add-run">＋ 続きの写真を追加</button><p class="status state" aria-live="polite"></p><p class="note preview"></p></section>`;if(cuts.includes(c))return `<section data-s="${c}"><h2>${c} <span class="status summary"></span></h2><small>1本につき写真1枚です。</small><label>写真番号（カンマ区切り）<input class="photos" inputmode="numeric" placeholder="001, 002"></label><p class="status state" aria-live="polite"></p></section>`;if(c==='US')return `<section data-s="US"><h2>運搬</h2><small>車種を選び、チェック中だけ「指定場所運搬」として保存します。</small><div class="transport-list">${transportRow()}</div><button type="button" class="secondary add-transport">＋ 運搬を追加</button></section>`;if(c==='DF')return `<section data-s="DF"><h2>倒木実費</h2><label>写真番号（カンマ区切り）<input class="photos" inputmode="numeric" placeholder="001, 002"></label></section>`;return `<section data-s="FR"><h2>自由記述</h2><label>区分<input class="free-label" placeholder="例: 崖のため伐採不可"></label><label>写真番号（カンマ区切り）<input class="photos" inputmode="numeric" placeholder="001, 002"></label></section>`}function sec(c){let e=form.querySelector(`[data-s="${c}"]`);if(!e){form.insertAdjacentHTML('beforeend',html(c));e=form.lastElementChild}return e}
function entries(e){let rows=[];e.querySelectorAll('.run').forEach(r=>{let s=r.querySelector('.start').value.trim(),v=(r.dataset.counts||'').split(',').filter(Boolean).map(Number);if(s&&v.length)v.forEach((n,i)=>rows.push({photo:no(Number(s)+i),count:n}))});return rows}function refreshUnder(e){let c=e.dataset.s,rows;try{rows=entries(e)}catch(err){e.querySelector('.state').textContent=err.message;e.querySelector('.state').className='status state warn';return}e.querySelectorAll('.run').forEach(r=>{let v=(r.dataset.counts||'').split(',').filter(Boolean);r.querySelector('.counts').textContent=v.length?v.map((n,i)=>`写真${i+1}: ${n}本`).join('　'):'まだ確定していません'});let total=rows.reduce((s,x)=>s+x.count,0),need=plan[c],state=e.querySelector('.state');e.querySelector('.summary').textContent=`入力 ${total}本 / 予定 ${need}本`;if(total<need){state.textContent=`不足 ${need-total}本`;state.className='status state short';e.querySelector('.preview').textContent='';return}if(total===need){state.textContent='予定分完了';state.className='status state ok';e.querySelector('.preview').textContent='台帳: 予定RUNのみ';return}let split=part(rows,need);if(!split.exact){state.textContent='予定分と追加分を写真単位で分けられません';state.className='status state warn';e.querySelector('.preview').textContent='写真を分割せずPC側でも要確認';return}let view=items=>{let n=1;return items.map(x=>{let end=n+x.count-1,t=`${x.photo}（${n===end?`①${n}`:`①${n}〜${end}`}）`;n=end+1;return t}).join(' → ')};state.textContent=`予定分完了・追加 ${total-need}本（候補）`;state.className='status state added';e.querySelector('.preview').textContent=`台帳: 予定RUN ${view(split.planned)} ｜ 追加RUN ${view(split.added)}`}function refreshSingle(e){let c=e.dataset.s,n=e.querySelector('.photos').value.split(',').map(x=>x.trim()).filter(Boolean).length,need=plan[c],state=e.querySelector('.state');e.querySelector('.summary').textContent=`入力 ${n}枚 / 予定 ${need}本`;state.textContent=n<need?`不足 ${need-n}本`:n===need?'予定分完了':`予定分完了・追加 ${n-need}本（候補）`;state.className=`status state ${n<need?'short':n===need?'ok':'added'}`}function refresh(){form.querySelectorAll('section[data-s]').forEach(e=>{if(e.dataset.s==='E10'||e.dataset.s==='N10')refreshUnder(e);else if(cuts.includes(e.dataset.s))refreshSingle(e)})}
function collect(){let data={schema:'ippatsu-photo-ledger-instruction/v1',created_at:new Date().toISOString(),case:{share_date_key:q.get('date')||'',design_no:document.querySelector('#design').value.trim(),management_no:mno,span_label:span,planned:plan},pairs:{BA:[],TK:[],SB:[],TR:[]},cuts:Object.fromEntries(cuts.map(c=>[c,[]])),transport:[],special:[]};on().forEach(c=>{let e=sec(c);if(pairs.includes(c)){e.querySelectorAll('.pair').forEach(r=>{let a=r.querySelector('.before').value.trim(),b=r.querySelector('.after').value.trim();if(a||b)data.pairs[c].push({before:no(a),after:no(b)})});if(c==='TK')e.querySelector('.reuse').value.split(',').map(x=>x.trim()).filter(Boolean).forEach(v=>{let i=Number(v),ba=data.pairs.BA[i-1];if(!Number.isInteger(i)||!ba)throw Error('竹のBA流用組番号を確認してください');data.pairs.TK.push({...ba,reuse_ba_pair_indexes:[i]})})}else if(c==='E10'||c==='N10'){e.querySelectorAll('.run').forEach(r=>{let s=r.querySelector('.start').value.trim(),v=(r.dataset.counts||'').split(',').filter(Boolean).map(Number);if(s||v.length){if(!s||!v.length)throw Error(`${c} の開始写真番号と本数を入力してください`);data.cuts[c].push({start_photo:no(s),counts:v})}})}else if(cuts.includes(c))data.cuts[c]=photoList(e.querySelector('.photos').value);else if(c==='US')e.querySelectorAll('.transport-row').forEach(r=>{let photos=photoList(r.querySelector('.transport-photos').value);if(photos.length)data.transport.push({label:`${r.querySelector('.specified').checked?'指定場所運搬':'運搬'} ${r.querySelector('.vehicle').value}`,photos})});else if(c==='DF'){let photos=photoList(e.querySelector('.photos').value);if(photos.length)data.special.push({label:'倒木実費',photos})}else{let name=e.querySelector('.free-label').value.trim(),photos=photoList(e.querySelector('.photos').value);if(name||photos.length){if(!name||!photos.length)throw Error('自由記述は区分と写真番号の両方を入力してください');data.special.push({label:name,photos})}}});return data}
function persist(){try{localStorage.setItem(draftKey,JSON.stringify({selected:on(),data:collect()}));message.textContent='端末内の下書きを自動保存しました';message.className='message ok'}catch(err){message.textContent=err.message;message.className='message warn'}}function render(){let selected=new Set(on());codes.forEach(c=>{let e=sec(c);e.classList.toggle('hidden',!selected.has(c));if(selected.has(c))form.append(e)});refresh()}function restore(){let raw=localStorage.getItem(draftKey);if(!raw)return;try{let saved=JSON.parse(raw),data=saved.data;document.querySelector('#design').value=data.case.design_no||'';choices.querySelectorAll('[data-code]').forEach(b=>b.setAttribute('aria-pressed',saved.selected.includes(b.dataset.code)));render();saved.selected.forEach(c=>{let e=sec(c);if(pairs.includes(c)){e.querySelector('.pair-list').innerHTML='';(data.pairs[c]||[]).filter(r=>!(c==='TK'&&r.reuse_ba_pair_indexes?.length)).forEach(r=>e.querySelector('.pair-list').insertAdjacentHTML('beforeend',pairRow(r.before,r.after)));if(!e.querySelector('.pair-list').children.length)e.querySelector('.pair-list').insertAdjacentHTML('beforeend',pairRow());if(c==='TK')e.querySelector('.reuse').value=(data.pairs.TK||[]).flatMap(r=>r.reuse_ba_pair_indexes||[]).join(',')}else if(c==='E10'||c==='N10'){e.querySelector('.runs').innerHTML='';(data.cuts[c]||[]).forEach(r=>e.querySelector('.runs').insertAdjacentHTML('beforeend',runRow(r.start_photo,r.counts)));if(!e.querySelector('.runs').children.length)e.querySelector('.runs').insertAdjacentHTML('beforeend',runRow())}else if(cuts.includes(c))e.querySelector('.photos').value=(data.cuts[c]||[]).join(', ');else if(c==='US'){e.querySelector('.transport-list').innerHTML='';(data.transport||[]).forEach(r=>{let m=r.label.match(/^(指定場所運搬|運搬)\s+(軽四輪|2t車)$/);if(m)e.querySelector('.transport-list').insertAdjacentHTML('beforeend',transportRow(m[2],m[1]==='指定場所運搬',r.photos.join(',')))});if(!e.querySelector('.transport-list').children.length)e.querySelector('.transport-list').insertAdjacentHTML('beforeend',transportRow())}else if(c==='DF'){let row=(data.special||[]).find(r=>r.label==='倒木実費');e.querySelector('.photos').value=row?row.photos.join(', '):''}else{let row=(data.special||[]).find(r=>r.label!=='倒木実費');e.querySelector('.free-label').value=row?row.label:'';e.querySelector('.photos').value=row?row.photos.join(', '):''}});refresh();message.textContent='端末内の下書きを読み込みました';message.className='message ok'}catch(err){localStorage.removeItem(draftKey)}}
codes.forEach(c=>choices.insertAdjacentHTML('beforeend',`<button type="button" class="choice" data-code="${c}" aria-pressed="${c==='BA'||plan[c]>0}">${label[c]}${plan[c]?`（予定 ${plan[c]}）`:''}</button>`));choices.addEventListener('click',ev=>{let b=ev.target.closest('[data-code]');if(!b)return;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');render();persist()});form.addEventListener('click',ev=>{let e=ev.target.closest('section[data-s]');if(!e)return;if(ev.target.closest('.add-pair'))e.querySelector('.pair-list').insertAdjacentHTML('beforeend',pairRow());if(ev.target.closest('.add-run'))e.querySelector('.runs').insertAdjacentHTML('beforeend',runRow());if(ev.target.closest('.add-transport'))e.querySelector('.transport-list').insertAdjacentHTML('beforeend',transportRow());let b=ev.target.closest('[data-key]');if(b){let r=b.closest('.run'),pending=r.dataset.pending||'',k=b.dataset.key;if(k==='back')pending=pending.slice(0,-1);else if(k==='enter'){if(pending&&Number(pending)>0){r.dataset.counts=[...(r.dataset.counts?r.dataset.counts.split(','):[]),String(Number(pending))].join(',');pending=''}}else pending+=k;r.dataset.pending=pending;r.querySelector('.pending').textContent=pending?`入力中: ${pending}本`:'';refreshUnder(e)}persist()});form.addEventListener('input',()=>{refresh();persist()});form.addEventListener('change',()=>persist());document.querySelector('#save').onclick=persist;document.querySelector('#clear').onclick=()=>{localStorage.removeItem(draftKey);message.textContent='このケースの端末内下書きを削除しました';message.className='message ok'};document.querySelector('#download').onclick=()=>{try{let data=collect(),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${q.get('date')||'date'}_${mno}_写真台帳指示.json`;a.click();URL.revokeObjectURL(a.href);persist();message.textContent='JSONを保存しました。端末内下書きは残しています。';message.className='message ok'}catch(err){message.textContent=err.message;message.className='message warn'}};restore();render();
})();
</script>
