<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=contain,interactive-widget=resizes-content"><meta name="theme-color" content="#f7f5ed"><meta name="description" content="いっぱつちゃんとの会話で、施工予定の確認・編集と完了報告ができます。"><title>いっぱつちゃん｜現場共有ポータル</title><link rel="icon" href="ippatsu.webp"><link rel="stylesheet" href="chat.css?v=sandbox-mode1"></head>
<body><main>
<header><a class="back" href="../" aria-label="共有ポータルへ戻る">‹</a><img src="ippatsu.webp" alt="" width="46" height="46"><div><h1>いっぱつちゃん</h1><p>現場共有ポータル</p></div><details id="usage" hidden><summary id="balance-label">残量 —</summary><aside><p id="balance-detail">無料枠 $100・未登録</p><button id="lock">ロック</button></aside></details></header>
<section id="welcome"><img src="ippatsu.webp" alt="" width="104" height="104"><h2>おつかれさまっす！</h2><p>現場の予定を見たり、完了を報告したり。<br>いつもの言葉で声をかけてください！</p>
<form id="login"><label for="pin">暗証番号</label><input id="pin" inputmode="numeric" type="password" autocomplete="current-password" maxlength="16" required><button>チャットを開く</button></form><p id="notice" role="status"></p></section>
<section id="thread" hidden aria-label="会話"><div id="messages" role="log" aria-live="polite"></div><div id="typing" hidden>いっぱつちゃんが確認中…</div>
<form id="compose"><textarea id="message" rows="1" aria-label="メッセージ" maxlength="1800" placeholder="メッセージを書く"></textarea><button aria-label="送信">送信</button></form>
<p id="pole-notice" role="status" hidden></p>
<div id="chat-tools" class="suggestions"><button data-chat>今日の施工予定は？</button><button data-chat>予定を追加したい</button><button data-chat>完了報告したい</button><button id="recent" type="button">受付履歴</button><button id="test-mode" type="button">テストモード</button><button id="reset" type="button">新しい会話</button></div>
<div id="pole-tools" class="suggestions" hidden><button id="pole-geo" type="button">現在地の周辺200m</button><label><input id="pole-links-only" type="checkbox">地図リンクだけ表示</label></div>
<section id="sandbox-tools" hidden><h2>砂場</h2><p>作りたい道具や直したいところを教えてね。</p><form><label>作成・編集するページ<select name="target"><option value="">新しいページ</option></select></label><label>いっぱつちゃんへの依頼<textarea name="prompt" required maxlength="1800"></textarea></label><button>下書きを作る</button></form><p role="status"></p><div class="sandbox-preview"></div><button class="sandbox-publish" hidden>砂場に掲載</button><div class="sandbox-pages"></div><a class="result-link" href="../sandbox/survey-lists/">現調リスト</a><a class="result-link" href="../sandbox/">砂場の子ページ一覧</a></section>
<div class="input-modes" role="group" aria-label="入力モード"><button id="chat-mode" type="button" aria-pressed="true">通常チャット</button><button id="pole-mode" type="button" aria-pressed="false">電柱検索</button><button id="sandbox-mode" type="button" aria-pressed="false">砂場</button></div></section>
<noscript>チャットを使うにはJavaScriptを有効にしてください。</noscript></main><script type="module" src="chat.mjs?v=sandbox-mode1"></script><script type="module" src="sandbox-tools.mjs"></script></body></html>
