<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=contain,interactive-widget=resizes-content"><meta name="theme-color" content="#f7f5ed"><meta name="description" content="いっぱつちゃんとの会話で、施工予定の確認・編集と完了報告ができます。"><title>いっぱつちゃん｜現場共有ポータル</title><link rel="icon" href="ippatsu.webp"><link rel="stylesheet" href="chat.css?v=poles1"></head>
<body><main>
<header><a class="back" href="../" aria-label="共有ポータルへ戻る">‹</a><img src="ippatsu.webp" alt="" width="46" height="46"><div><h1>いっぱつちゃん</h1><p>現場共有ポータル</p></div><button id="lock" hidden>ロック</button></header>
<section id="welcome"><img src="ippatsu.webp" alt="" width="104" height="104"><h2>おつかれさまっす！</h2><p>現場の予定を見たり、完了を報告したり。<br>いつもの言葉で声をかけてください！</p>
<form id="login"><label for="pin">暗証番号</label><input id="pin" inputmode="numeric" type="password" autocomplete="current-password" maxlength="16" required><button>チャットを開く</button></form><p id="notice" role="status"></p></section>
<section id="thread" hidden aria-label="会話"><div id="messages" role="log" aria-live="polite"></div><div id="typing" hidden>いっぱつちゃんが確認中…</div>
<form id="compose"><textarea id="message" rows="1" aria-label="メッセージ" maxlength="1800" placeholder="メッセージを書く"></textarea><button aria-label="送信">送信</button></form>
<div class="suggestions"><button id="pole-open" type="button">電柱ナビ</button><button>今日の施工予定は？</button><button>予定を追加したい</button><button>完了報告したい</button><button id="recent" type="button">受付履歴</button><button id="test-mode" type="button">テストモード</button><button id="reset" type="button">新しい会話</button></div></section>
<dialog id="pole-dialog" aria-labelledby="pole-heading"><form id="pole-form">
<h2 id="pole-heading">電柱ナビ</h2><label for="pole-query">電柱名・径間名・冠称・座標</label>
<textarea id="pole-query" rows="5" maxlength="1800" placeholder="複数の径間は1行ずつ入力"></textarea>
<label><input id="pole-links-only" type="checkbox"> 地図リンクだけ表示</label>
<p id="pole-notice" role="status"></p><div class="pole-actions"><button type="submit" class="apply">地図を検索</button><button id="pole-geo" type="button">現在地の周辺200m</button><button id="pole-close" type="button">閉じる</button></div></form></dialog>
<noscript>チャットを使うにはJavaScriptを有効にしてください。</noscript></main><script type="module" src="chat.mjs?v=poles1"></script></body></html>
