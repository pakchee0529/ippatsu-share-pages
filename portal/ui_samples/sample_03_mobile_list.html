<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Sample 03 - Mobile List</title>
  <style>
    :root { --bg:#ffffff; --text:#0f1f35; --muted:#5c6c82; --line:#dce4f0; --btn:#1264d8; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif; }
    .wrap { max-width:700px; margin:0 auto; padding:12px; }
    .sample { font-size:12px; font-weight:700; background:#fff3cb; color:#7a4b00; border:1px solid #f0d48d; border-radius:999px; padding:4px 10px; display:inline-block; }
    h1 { margin:10px 0 8px; font-size:22px; }
    .search { width:100%; min-height:46px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:16px; margin-bottom:10px; }
    .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; border-bottom:1px solid var(--line); padding:10px 0; }
    .date { font-size:12px; color:var(--muted); margin-bottom:2px; } .name { font-weight:700; font-size:16px; } .info { font-size:13px; color:var(--muted);}
    .btn { min-height:48px; min-width:78px; border-radius:10px; text-decoration:none; color:#fff; background:var(--btn); display:flex; align-items:center; justify-content:center; font-weight:700; }
    @media (max-width:560px){ .row{grid-template-columns:1fr;} .btn{width:100%;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sample">UIサンプル / 本番ではありません</div>
    <h1>現場共有ポータル（Mobile List）</h1>
    <input id="q" class="search" type="search" placeholder="日付・冠称名・補足・件数で絞り込み">
    <section id="list">
      <article class="row" data-key="2026年05月08日 百谷 北宇智 5件"><div><div class="date">2026年05月08日</div><div class="name">百谷・北宇智</div><div class="info">5件</div></div><a class="btn" href="../share/260508/">開く</a></article>
      <article class="row" data-key="2026年05月09日 南千股 7件"><div><div class="date">2026年05月09日</div><div class="name">南千股</div><div class="info">7件</div></div><a class="btn" href="../share/260509/">開く</a></article>
      <article class="row" data-key="2026年05月11日 小川 5件"><div><div class="date">2026年05月11日</div><div class="name">小川</div><div class="info">5件</div></div><a class="btn" href="../share/260511/">開く</a></article>
      <article class="row" data-key="2026年05月12日 小川 6件"><div><div class="date">2026年05月12日</div><div class="name">小川</div><div class="info">6件</div></div><a class="btn" href="../share/260512/">開く</a></article>
      <article class="row" data-key="2026年05月13日 古ル野 6件"><div><div class="date">2026年05月13日</div><div class="name">古ル野</div><div class="info">6件</div></div><a class="btn" href="../share/260513/">開く</a></article>
      <article class="row" data-key="2026年05月14日 小川 古ル野 6件"><div><div class="date">2026年05月14日</div><div class="name">小川・古ル野</div><div class="info">6件</div></div><a class="btn" href="../share/260514/">開く</a></article>
      <article class="row" data-key="2026年05月15日 小川 4件"><div><div class="date">2026年05月15日</div><div class="name">小川</div><div class="info">4件</div></div><a class="btn" href="../share/260515/">開く</a></article>
      <article class="row" data-key="2026年05月18日 葛川 4件 人力感謝デー"><div><div class="date">2026年05月18日</div><div class="name">葛川</div><div class="info">4件 / 人力感謝デー</div></div><a class="btn" href="../share/260518/">開く</a></article>
      <article class="row" data-key="2026年12月31日 赤松 大畑 柴ヶ谷 白銀 ほか8件 45件"><div><div class="date">2026年12月31日</div><div class="name">赤松・大畑・柴ヶ谷・白銀 ほか8件</div><div class="info">45件</div></div><a class="btn" href="../share/261231/">開く</a></article>
    </section>
  </div>
  <script>
    const q = document.getElementById("q");
    const rows = Array.from(document.querySelectorAll("#list .row"));
    q.addEventListener("input", () => {
      const k = q.value.trim().toLowerCase();
      rows.forEach((r) => {
        const hit = !k || (r.dataset.key || "").toLowerCase().includes(k);
        r.style.display = hit ? "grid" : "none";
      });
    });
  </script>
</body>
</html>
