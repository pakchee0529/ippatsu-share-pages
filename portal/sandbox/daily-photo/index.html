<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>今日の一枚｜みんなの砂場</title><link rel="stylesheet" href="../playground.css"><link rel="stylesheet" href="feed.css"></head>
<body><main><nav><a href="../">‹　みんなの砂場</a></nav><h1>今日の一枚</h1>
<button id="join" aria-haspopup="dialog" aria-label="写真を投稿する"><span aria-hidden="true">＋</span> 投稿</button><dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">写真を投稿</h2><button id="dismiss" aria-label="閉じる">閉じる</button></div><form id="unlock" hidden><label>投稿・いいね・コメント用の暗証番号<input name="pin" type="password" inputmode="numeric" required></label><button>開く</button></form>
<form id="compose" hidden><label>表示名<input id="name" maxlength="24" required placeholder="ニックネームでもOK"></label><label>写真を選ぶ<input id="photo" type="file" accept="image/*" required></label><img id="preview" alt="投稿する写真" hidden><label>ひと言<input id="caption" maxlength="140" placeholder="今日はこんな景色やったよ" required></label><button>投稿する</button></form>
<p id="sheet-status" role="status"></p></dialog><p id="status" role="status"></p><section><h2>みんなの写真</h2><div id="photo-strip" aria-label="写真から投稿を選ぶ"></div><div id="feed"></div><button id="more" hidden>前の投稿を見る</button></section><dialog id="viewer" aria-label="写真を拡大"><button id="viewer-close" autofocus>閉じる</button><img id="full-photo" alt=""><p id="full-caption"></p></dialog></main><script type="module" src="feed.mjs"></script></body></html>
