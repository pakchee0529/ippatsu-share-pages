<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>昼休みマップ｜みんなの砂場</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="lunch.css"><link rel="stylesheet" href="../../account/style.css"></head>
<body><main><nav><a href="../">‹　みんなの砂場</a><button id="account-entry">ログイン・登録</button></nav>
<h1>昼休みマップ</h1><p>休める場所をタップして、駐車の目安や過ごしやすい時間を共有しよう。</p>
<div id="map" aria-label="休憩場所の地図"></div><button id="locate">現在地にピンを立てる</button>
<p id="status" role="status"></p><section><h2>みんなの休憩スポット</h2><div id="spots"></div></section>
<dialog id="edit"><form id="editor"><h2 id="heading"></h2><p id="position"></p><label id="name-label">スポット名<input name="name" maxlength="60"></label>
<fieldset><legend>車種ごとの駐車台数</legend><small>分かる車種だけ。停められない場合は0台。</small><div id="vehicles"></div></fieldset>
<div class="pair"><label>快適な季節<select name="season"><option value="">未確認</option><option>春</option><option>夏</option><option>秋</option><option>冬</option><option>通年</option></select></label><label>時間帯<select name="time"><option value="">未確認</option><option>昼</option><option>朝</option><option>午後</option><option>夕方</option></select></label></div>
<label>ひと言<textarea name="note" maxlength="300" placeholder="日陰の時間、出入りのしやすさなど"></textarea></label><p id="error" role="status"></p><div class="actions"><button type="button" id="cancel">閉じる</button><button class="primary" id="save">投稿する</button></div></form></dialog></main><script type="module" src="lunch.mjs"></script></body></html>
