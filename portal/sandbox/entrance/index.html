<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>現場の進入口｜みんなの砂場</title>
  <link rel="stylesheet" href="entrance.css">
  <link rel="stylesheet" href="../../account/style.css">
</head>
<body>
<main>
  <nav aria-label="ページ操作"><a href="../">みんなの砂場へ</a><button id="account-entry">ログイン・登録</button></nav>
  <header><h1>現場の進入口</h1><p id="intro">集合場所から歩く道や車を置く場所を、写真で共有。</p><button type="button" id="try-photo">自分の写真で矢印を試す</button></header>
  <section id="picker" aria-labelledby="picker-title">
    <h2 id="picker-title">現場を探す</h2>
    <form id="search" role="search"><input id="query" type="search" aria-label="設計番号・径間名・管理番号で検索" placeholder="設計番号・径間名・管理番号" maxlength="100"><button>検索</button></form>
    <p id="search-status" role="status"></p>
    <ul id="cases"></ul>
  </section>
  <section id="detail" aria-labelledby="selected-label" hidden>
    <button type="button" id="back">現場を選び直す</button>
    <h2 id="selected-label" tabindex="-1"></h2><p id="selected-meta"></p>
    <button type="button" class="primary" id="add">進入口の写真を追加</button>
    <p id="photos-status" role="status"></p><button id="retry" hidden>写真を再読み込み</button>
    <div id="photos"></div>
  </section>
</main>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="upload">
    <div class="heading"><h2 id="editor-title">写真を追加</h2><button id="close-editor" type="button">閉じる</button></div>
    <p id="editor-case"></p>
    <div class="sources">
      <label class="file-action">撮影する<input type="file" id="camera" accept="image/*" capture="environment"></label>
      <label class="file-action">写真を選ぶ<input type="file" id="file" accept="image/*"></label>
    </div>
    <div id="drawing" hidden>
      <p>進む方向に指で線を引くと、矢印が付きます。</p>
      <canvas id="canvas" aria-label="選んだ写真。写真上で矢印を描けます"></canvas>
      <button type="button" id="undo">矢印をひとつ戻す</button>
    </div>
    <label for="note">道順・目印<span>（任意）</span></label>
    <textarea id="note" rows="2" maxlength="300" placeholder="橋を渡ってすぐ左の坂道へ"></textarea>
    <p id="upload-status" role="status"></p>
    <button type="submit" id="preview-button" class="primary" disabled>仕上がりを見る</button>
  </form>
</dialog>
<dialog id="preview-dialog" aria-labelledby="preview-title">
  <h2 id="preview-title">仕上がり</h2>
  <p id="preview-context"></p>
  <div id="preview-output"></div>
  <p id="preview-status" role="status"></p>
  <div class="preview-actions">
    <button type="button" id="preview-back">矢印やメモを直す</button>
    <button type="button" id="preview-finish" hidden>試し描きを終了</button>
    <button type="button" class="primary" id="confirm-save">この現場に保存</button>
  </div>
</dialog>
<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="heading"><h2 id="viewer-title">進入口の写真</h2><button id="close-viewer">閉じる</button></div>
  <div id="large-photo"></div>
</dialog>
<noscript>進入口の写真を見るには、ブラウザのJavaScriptを有効にしてください。</noscript>
<script type="module" src="./entrance.mjs"></script>
</body>
</html>
