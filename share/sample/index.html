<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木ノ原78 4径間</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
:root {
  --bg: #f4f5f7;
  --card: #fff;
  --text: #1a1a1a;
  --muted: #5c6370;
  --border: #e1e4e8;
  --accent: #2563eb;
  --accent2: #0d9488;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans",
    "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 0.75rem 0.75rem 1.25rem;
}
.page-title {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0 0 1rem;
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
}
.card {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 0.85rem 1rem;
  margin-bottom: 0.75rem;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.card-head {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}
.card-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0;
}
.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.45rem 0.75rem;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  min-height: 40px;
  touch-action: manipulation;
}
.btn-map {
  background: var(--accent);
  color: #fff;
}
.btn-map:hover, .btn-map:focus { filter: brightness(1.05); }
.btn-note {
  background: #fff;
  color: var(--accent2);
  border: 2px solid var(--accent2);
}
.btn-note[aria-expanded="true"] {
  background: var(--accent2);
  color: #fff;
}
.note-panel {
  margin-top: 0.65rem;
  padding: 0.65rem 0.75rem;
  background: #f8fafc;
  border-radius: 8px;
  border: 1px dashed var(--border);
  font-size: 0.92rem;
  color: var(--text);
}
.note-panel[hidden] { display: none !important; }
.map-section {
  margin-top: 1.25rem;
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 0.75rem 1rem 1rem;
}
.map-section h2 {
  font-size: 1.05rem;
  margin: 0 0 0.5rem;
}
#share-map {
  width: 100%;
  height: min(55vh, 420px);
  min-height: 220px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.leaflet-container { font-family: inherit; }
@media (min-width: 480px) {
  .card-head {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
  }
  .page-title { font-size: 1.4rem; }
}
</style>
</head>
<body>
<header>
  <h1 class="page-title">木ノ原78 4径間</h1>
</header>
<main>
<article class="card" data-card-index="0">
  <div class="card-head">
    <h2 class="card-title">小川2〜3</h2>
    <div class="card-actions">
      <a class="btn btn-map" href="https://www.google.com/maps?q=34.000000,135.000000" target="_blank" rel="noopener noreferrer">地図を開く</a>
      <button type="button" class="btn btn-note" aria-expanded="false"
        aria-controls="note-0" data-note-toggle>現場指示</button>
    </div>
  </div>
  <div class="note-panel" id="note-0" hidden>集積 道東へ 広枝1 広根10</div>
</article>
<article class="card" data-card-index="1">
  <div class="card-head">
    <h2 class="card-title">小川71〜72</h2>
    <div class="card-actions">
      <a class="btn btn-map" href="https://www.google.com/maps?q=34.001000,135.001000" target="_blank" rel="noopener noreferrer">地図を開く</a>
      <button type="button" class="btn btn-note" aria-expanded="false"
        aria-controls="note-1" data-note-toggle>現場指示</button>
    </div>
  </div>
  <div class="note-panel" id="note-1" hidden>集積 その場 広枝10</div>
</article>
<article class="card" data-card-index="2">
  <div class="card-head">
    <h2 class="card-title">小川74〜75</h2>
    <div class="card-actions">
      <a class="btn btn-map" href="https://www.google.com/maps?q=34.002000,135.002000" target="_blank" rel="noopener noreferrer">地図を開く</a>
      <button type="button" class="btn btn-note" aria-expanded="false"
        aria-controls="note-2" data-note-toggle>現場指示</button>
    </div>
  </div>
  <div class="note-panel" id="note-2" hidden>持出 ハシゴ注意</div>
</article>
<article class="card" data-card-index="3">
  <div class="card-head">
    <h2 class="card-title">古ル野18〜19</h2>
    <div class="card-actions">
      <a class="btn btn-map" href="https://www.google.com/maps?q=34.003000,135.003000" target="_blank" rel="noopener noreferrer">地図を開く</a>
      <button type="button" class="btn btn-note" aria-expanded="false"
        aria-controls="note-3" data-note-toggle>現場指示</button>
    </div>
  </div>
  <div class="note-panel" id="note-3" hidden>入力側から確認</div>
</article>
  <section class="map-section" aria-labelledby="map-heading">
    <h2 id="map-heading">全体地図</h2>
    <div id="share-map" role="application" aria-label="全径間の位置"></div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
(function() {
  var POINTS = [{"name":"小川2〜3","lat":34.0,"lng":135.0},{"name":"小川71〜72","lat":34.001,"lng":135.001},{"name":"小川74〜75","lat":34.002,"lng":135.002},{"name":"古ル野18〜19","lat":34.003,"lng":135.003}];
  document.querySelectorAll("[data-note-toggle]").forEach(function(btn) {
    var id = btn.getAttribute("aria-controls");
    var panel = id && document.getElementById(id);
    if (!panel) return;
    btn.addEventListener("click", function() {
      var open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", open ? "false" : "true");
      panel.hidden = open;
    });
  });
  if (!window.L || !POINTS.length) return;
  var map = L.map("share-map", { scrollWheelZoom: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);
  var bounds = [];
  function escHtml(t) {
    var d = document.createElement("div");
    d.textContent = t == null ? "" : String(t);
    return d.innerHTML;
  }
  POINTS.forEach(function(p) {
    var m = L.marker([p.lat, p.lng]).addTo(map);
    if (p.name) m.bindPopup(escHtml(p.name));
    bounds.push([p.lat, p.lng]);
  });
  if (bounds.length === 1) {
    map.setView(bounds[0], 15);
  } else {
    map.fitBounds(bounds, { padding: [28, 28], maxZoom: 16 });
  }
})();
</script>
</body>
</html>
